<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>DA-SAR - Daya Saran Perbaikan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- DA-SAR design tokens (adapted from the DM-SMS design system) ---- */
    --primary-50: oklch(97.1% .013 17.38);
    --primary-100: oklch(93.6% .032 17.717);
    --primary-400: oklch(70.4% .191 22.216);
    --primary-500: oklch(63.7% .237 25.331);
    --primary-600: oklch(57.7% .245 27.325);
    --primary-700: oklch(50.5% .213 27.518);
    --gray-50: oklch(98.5% .002 247.839);
    --gray-100: oklch(96.7% .003 264.542);
    --gray-200: oklch(92.8% .006 264.531);
    --gray-300: oklch(87.2% .01 258.338);
    --gray-400: oklch(70.7% .022 261.325);
    --gray-500: oklch(55.1% .027 264.364);
    --gray-600: oklch(44.6% .03 256.802);
    --gray-700: oklch(37.3% .034 259.733);
    --gray-900: oklch(21% .034 264.665);
    --success-50: oklch(97.9% .021 166.113);
    --success-600: oklch(59.6% .145 163.225);
    --success-700: oklch(50.8% .118 165.612);
    --warning-50: oklch(98.7% .022 95.277);
    --warning-600: oklch(66.6% .179 58.318);
    --warning-700: oklch(55.5% .163 48.998);
    --info-50: oklch(97% .014 254.604);
    --info-600: oklch(54.6% .245 262.881);
    --info-700: oklch(48.8% .243 264.376);

    --surface-page: var(--gray-50);
    --surface-card: #fff;
    --border-default: var(--gray-200);
    --text-heading: var(--gray-900);
    --text-body: var(--gray-700);
    --text-muted: var(--gray-500);
    --focus-ring: var(--primary-100);

    --radius-md: .375rem;
    --radius-lg: .5rem;
    --radius-xl: .75rem;
    --radius-full: 999px;
    --ring-card: inset 0 0 0 1px rgba(0,0,0,.05);
    --shadow-sm: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);

    --font-sans: 'Inter', 'Segoe UI', Arial, sans-serif;

    /* legacy aliases - every existing var(--x) usage below keeps working unchanged */
    --primary: var(--primary-600);
    --dark: var(--gray-900);
    --bg: var(--surface-page);
    --ok: var(--success-600);
    --warn: var(--warning-600);
  }
  *{box-sizing:border-box;font-family:var(--font-sans);}
  body{margin:0;background:var(--bg);color:var(--text-body);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:var(--surface-card);border-right:1px solid var(--border-default);display:flex;flex-direction:column;padding:20px 16px;gap:20px;}
  .sidebar .brand{display:flex;align-items:center;gap:10px;}
  .sidebar .brand-badge{width:36px;height:36px;border-radius:var(--radius-lg);background:var(--primary-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sidebar h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--text-heading);white-space:nowrap;}
  .sidebar h1 .dot{color:var(--primary-600);}
  .sidebar h1 .subtitle{display:block;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin-top:2px;white-space:nowrap;}
  .sidebar-role{display:flex;flex-direction:column;gap:8px;}
  .sidebar-role select{width:100%;max-width:none;}
  #tabs{display:flex;flex-direction:column;gap:2px;}
  #tabs button{display:flex;align-items:center;gap:10px;border:none;background:none;padding:9px 12px;border-radius:var(--radius-lg);cursor:pointer;font-size:13px;font-weight:500;color:var(--gray-600);text-align:left;transition:background .15s,color .15s;}
  #tabs button svg{flex-shrink:0;}
  #tabs button:hover{background:var(--gray-50);}
  #tabs button.active{background:var(--primary-50);color:var(--primary-700);font-weight:600;}
  .shell-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface-page);}
  .topbar{height:56px;background:var(--surface-card);border-bottom:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;gap:10px;}
  .topbar-title{font-size:15px;font-weight:600;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-context{font-size:12px;color:var(--text-muted);white-space:nowrap;}
  main{padding:24px;max-width:1100px;margin:0 auto;width:100%;}
  @media (max-width:900px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:12px;border-right:none;border-bottom:1px solid var(--border-default);}
    .sidebar .brand{flex:1;}
    .sidebar-role{flex-direction:row;flex-wrap:wrap;gap:8px;}
    #tabs{flex-direction:row;flex-wrap:wrap;width:100%;order:3;border-top:1px solid var(--border-default);padding-top:10px;}
    main{padding:16px;}
  }
  .card{background:var(--surface-card);border-radius:var(--radius-xl);padding:20px;margin-bottom:16px;box-shadow:var(--ring-card),var(--shadow-sm);}
  .card.accordion{padding:0;}
  .accordion-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;cursor:pointer;user-select:none;}
  .accordion-head h3{margin:0;}
  .accordion-chevron{color:var(--primary-600);font-size:11px;transition:transform .15s;flex-shrink:0;}
  .card.accordion[data-open="false"] .accordion-chevron{transform:rotate(-90deg);}
  .accordion-body{padding:0 20px 20px;}
  .card.accordion[data-open="false"] .accordion-body{display:none;}
  h3{color:var(--text-heading);font-size:16px;letter-spacing:-.01em;}
  h4{color:var(--text-heading);font-size:14px;}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--text-body);}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--gray-300);border-radius:var(--radius-md);font-size:14px;color:var(--text-heading);background:var(--surface-card);transition:border-color .15s,box-shadow .15s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-500);box-shadow:0 0 0 3px var(--focus-ring);}
  .req::after{content:" *";color:var(--primary-600);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row>div{flex:1;min-width:160px;}
  button.primary{background:var(--primary-600);color:#fff;border:none;padding:10px 18px;border-radius:var(--radius-lg);cursor:pointer;font-size:14px;font-weight:600;margin-top:14px;transition:background .15s;}
  button.primary:hover{background:var(--primary-700);}
  button.primary:disabled{background:var(--gray-300);cursor:not-allowed;}
  button.secondary{background:var(--gray-100);color:var(--text-body);border:none;padding:8px 14px;border-radius:var(--radius-lg);cursor:pointer;font-size:14px;font-weight:500;margin-top:8px;transition:background .15s;}
  button.secondary:hover{background:var(--gray-200);}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  th,td{border-bottom:1px solid var(--border-default);padding:9px 8px;text-align:left;}
  th{background:var(--gray-50);color:var(--text-muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  tbody tr:hover{background:var(--gray-50);}
  .badge{padding:4px 10px;border-radius:var(--radius-full);font-size:12px;font-weight:600;}
  .badge.wait{background:var(--warning-50);color:var(--warning-700);}
  .badge.ready{background:var(--info-50);color:var(--info-700);}
  .badge.sent{background:var(--success-50);color:var(--success-700);}
  .badge.followup{background:var(--gray-100);color:var(--gray-700);}
  .badge.overdue{background:var(--primary-50);color:var(--primary-700);}
  .badge.refollow{background:#f3e8ff;color:#7c3aed;}
  .item-block{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:14px;margin-top:10px;position:relative;}
  .items-table td,.items-table th{vertical-align:middle;}
  .items-table td input{margin:0;}
  .items-table td:nth-child(2) input{width:70px;}
  /* Kolom lain (nama jasa/part, keterangan, dll) gampang kolaps jadi sangat sempit karena
     input/select width:100% tanpa sinyal ukuran lain ke browser di dalam <table> - kasih
     lebar minimum supaya tetap terbaca, kecuali kolom ke-2 yang memang sengaja sempit
     (Waktu/Qty) di atas. */
  .items-table td:not(:nth-child(2)) input,.items-table td:not(:nth-child(2)) select{min-width:130px;}
  .beranda-lb-row:hover{background:var(--gray-50);}
  #ban-merk-extra input{width:100%;}
  .row-remove{background:none;border:none;color:var(--primary-600);font-size:18px;line-height:1;cursor:pointer;padding:4px 8px;margin:0;}
  .kpi{display:flex;gap:16px;flex-wrap:wrap;}
  .kpi .box{flex:1;min-width:150px;background:var(--surface-card);border-radius:var(--radius-xl);padding:16px;text-align:center;box-shadow:var(--ring-card),var(--shadow-sm);}
  .kpi .box.filterable{cursor:pointer;user-select:none;transition:box-shadow .15s;}
  .kpi .box.filterable:hover{box-shadow:0 0 0 2px var(--gray-300);}
  .kpi .box.filterable.active{box-shadow:0 0 0 2px var(--primary-500);}
  .kpi .box .num{font-size:26px;font-weight:700;color:var(--primary-600);}
  .kpi .box.warning .num{color:var(--warning-600);}
  .kpi .box.success .num{color:var(--success-600);}
  .kpi .box.info .num{color:var(--info-600);}
  .kpi .box .lbl{font-size:12px;color:var(--text-muted);}
  .chart-wrap{position:relative;height:240px;margin-top:14px;}
  .breakdown-table{overflow-x:auto;}
  .breakdown-table table{font-size:12.5px;}
  .breakdown-table td.clickable,.breakdown-table th.clickable{cursor:default;}
  .breakdown-table td.clickable{cursor:pointer;transition:background .15s;}
  .breakdown-table td.clickable:hover{background:var(--gray-100);}
  .note{font-size:12px;color:var(--text-muted);margin-top:6px;}
  .split-panel{display:flex;background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--ring-card),var(--shadow-sm);overflow:hidden;min-height:65vh;}
  .split-queue{width:300px;flex-shrink:0;border-right:1px solid var(--border-default);overflow-y:auto;padding:12px;}
  .split-detail{flex:1;overflow-y:auto;padding:20px;min-width:0;}
  .queue-item{background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:12px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s;}
  .queue-item:hover{box-shadow:var(--shadow-sm);}
  .queue-item.active{box-shadow:0 0 0 2px var(--primary-500);}
  @media (max-width:900px){
    .split-panel{flex-direction:column;min-height:0;}
    .split-queue{width:100%;border-right:none;border-bottom:1px solid var(--border-default);max-height:240px;}
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 00-5.4 4.6L4 16.2V20h3.8l5.3-5.3a4 4 0 004.6-5.4l-2.6 2.6-2-2 2.6-2.6z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>

      <h1>DA<span class="dot">&middot;</span>SAR<span class="subtitle">Daya Saran Perbaikan</span></h1>

        <option value="">-- Pilih Nama Teknisi --</option>
      </select>
      <select id="foremanSwitch" style="display:none;width:auto;">
        <option value="">-- Pilih Nama Foreman --</option>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
/* ============================================================
   GANTI dengan URL Web App hasil deploy Google Apps Script:
   contoh: https://script.google.com/macros/s/XXXXXXX/exec
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbyWb1fyKjQqjigkPWeCqYWGUePO_1mobVKYK8mnNRAO5Er1zXTXk-3x3GXVuw1TB6nPvw/exec";

let currentRole = "beranda";
let currentDetailId = null;
let currentSA = "";
let currentTeknisi = "";
let currentForeman = "";
let currentFreeCheck = "";
let currentView = null;

const ICON_STROKE = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  plusCircle: `<svg width="16" height="16" viewBox="0 0 24 24" ${ICON_STROKE}><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
  clock: `<svg width="16" height="16" viewBox="0 0 24 24" ${ICON_STROKE}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`,
  clipboardList: `<svg width="16" height="16" viewBox="0 0 24 24" ${ICON_STROKE}><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/><line x1="9" y1="18" x2="13" y2="18"/></svg>`,
  checkCircle: `<svg width="16" height="16" viewBox="0 0 24 24" ${ICON_STROKE}><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5.5"/></svg>`,
  documentText: `<svg width="16" height="16" viewBox="0 0 24 24" ${ICON_STROKE}><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><line x1="9.5" y1="12" x2="14.5" y2="12"/><line x1="9.5" y1="15.5" x2="14.5" y2="15.5"/></svg>`,
  buildingOffice: `<svg width="16" height="16" viewBox="0 0 24 24" ${ICON_STROKE}><rect x="5" y="3" width="14" height="18" rx="1"/><line x1="9" y1="7" x2="9" y2="7.01"/><line x1="15" y1="7" x2="15" y2="7.01"/><line x1="9" y1="11" x2="9" y2="11.01"/><line x1="15" y1="11" x2="15" y2="11.01"/><line x1="9" y1="15" x2="9" y2="15.01"/><line x1="15" y1="15" x2="15" y2="15.01"/><rect x="10" y="17" width="4" height="4"/></svg>`
};

const TABS = {
  teknisi:   [["input","Input Saran Baru","plusCircle"],["riwayat","Riwayat Saya","clock"]],
  foreman:   [["antrian","Antrian Perlu Dilengkapi","clipboardList"],["riwayatForeman","Riwayat","clock"]],
  sa:        [["konfirmasi","Perlu Dikonfirmasi","checkCircle"],["followup","Follow Up","clock"],["laporan","Kirim Report Customer","documentText"]],
  kabengkel: [["dashboard","Dashboard","buildingOffice"],["semua","Semua Kunjungan","clipboardList"]],
  freecheck: [["checkac","Free Check Up AC","plusCircle"],["checkspooring","Free Check Spooring","plusCircle"],["riwayatcheck","Riwayat","clock"]],
};
const VIEW_TITLES = {
  input:"Input Saran Baru", riwayat:"Riwayat Saya", antrian:"Antrian Perlu Dilengkapi", riwayatForeman:"Riwayat",
  konfirmasi:"Perlu Dikonfirmasi", followup:"Follow Up", laporan:"Kirim Report Customer",
  dashboard:"Dashboard", semua:"Semua Kunjungan",
  checkac:"Free Check Up AC", checkspooring:"Free Check Spooring", riwayatcheck:"Riwayat",
  beranda:"Beranda"
};
const ROLE_LABELS = { teknisi:"Teknisi", foreman:"Foreman", sa:"Service Advisor", kabengkel:"Kepala Bengkel", freecheck:"Teknisi AC/Spooring" };

/* ---------- Chart helper (dipakai Beranda & Dashboard Kepala Bengkel) ----------
   Funnel = 1 hue (satu metrik "jumlah unit" di berbagai tahap, bukan beberapa
   kategori berbeda) supaya tidak salah baca sebagai perbandingan antar kategori.
   Opportunity/Lost/Won = 3 warna status tetap (biru=menunggu, oranye=hilang,
   hijau=berhasil) - dicek lolos CVD-safe check, dan tetap ada angka langsung di
   kartu KPI di sampingnya supaya identitas tidak cuma mengandalkan warna. */
const CHART_COLOR_FUNNEL = '#dc2626';
const CHART_COLORS_OPPORTUNITY = ['#2563eb', '#ea580c', '#16a34a'];
// Kategori tetap per SA (dicek lolos validator buta warna dataviz untuk 4 warna
// pertama yang benar-benar dipakai saat ini) - kalau SA lebih dari 6, sisanya
// dilebur jadi abu-abu daripada bikin hue baru yang tidak lolos cek.
const CHART_COLORS_SA = ['#2563eb', '#ea580c', '#7c3aed', '#0891b2', '#e11d48', '#65a30d'];
function chartColorForSaIndex(i){ return CHART_COLORS_SA[i] || '#6b7280'; }
const CHART_INSTANCES = {};
function renderBarChart(canvasId, labels, data, colors){
  const canvas = document.getElementById(canvasId);
  if(!canvas || typeof Chart === 'undefined') return;
  if(CHART_INSTANCES[canvasId]) CHART_INSTANCES[canvasId].destroy();
  CHART_INSTANCES[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 4, maxBarThickness: 64 }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display:false }, tooltip: { callbacks: { label: c => ' ' + c.formattedValue + ' unit' } } },
      scales: {
        y: { beginAtZero:true, ticks:{ precision:0 }, grid:{ color:'var(--gray-100)' } },
        x: { grid:{ display:false }, ticks:{ font:{ size:11 } } }
      }
    }
  });
}
// Funnel per SA - horizontal stacked bar (1 baris per tahap funnel, dipecah warna per SA)
// supaya total tahap ATAU kontribusi SA tertentu di tahap itu sama-sama kelihatan dalam
// satu chart, alih-alih bentuk trapesium meruncing (Chart.js tidak punya tipe funnel asli).
// stageKeys/stageLabels harus urutan sama dengan buildBerandaFunnel(); saSeries = daftar
// {name, data:[count per tahap, urutan sama]}. Klik 1 segmen -> onCellClick(saName, stageKey).
function renderStackedFunnelChart(canvasId, stageKeys, stageLabels, saSeries, onCellClick){
  const canvas = document.getElementById(canvasId);
  if(!canvas || typeof Chart === 'undefined') return;
  if(CHART_INSTANCES[canvasId]) CHART_INSTANCES[canvasId].destroy();
  const datasets = saSeries.map((s,i)=>({
    label: s.name,
    data: s.data,
    backgroundColor: chartColorForSaIndex(i),
    borderRadius: 3,
    maxBarThickness: 26
  }));
  CHART_INSTANCES[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: { labels: stageLabels, datasets },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: (evt, elements) => {
        if(!elements.length) return;
        const el = elements[0];
        onCellClick(saSeries[el.datasetIndex].name, stageKeys[el.index]);
      },
      onHover: (evt, elements) => { evt.native.target.style.cursor = elements.length ? 'pointer' : 'default'; },
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:12, font:{ size:11 } } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.formattedValue} unit` } }
      },
      scales: {
        x: { stacked:true, beginAtZero:true, ticks:{ precision:0 }, grid:{ color:'var(--gray-100)' } },
        y: { stacked:true, grid:{ display:false }, ticks:{ font:{ size:11 } } }
      }
    }
  });
}

document.getElementById('roleSwitch').addEventListener('change', e=>{
  currentRole = e.target.value;
  currentSA = "";
  currentTeknisi = "";
  currentForeman = "";
  currentFreeCheck = "";
  updateIdentitySwitches();
  renderTabs();
});
document.getElementById('saSwitch').addEventListener('change', e=>{
  currentSA = e.target.value;
  render(currentView || TABS[currentRole][0][0]);
});
document.getElementById('teknisiSwitch').addEventListener('change', e=>{
  currentTeknisi = e.target.value;
  render(currentView || TABS[currentRole][0][0]);
});
document.getElementById('foremanSwitch').addEventListener('change', e=>{
  currentForeman = e.target.value;
  render(currentView || TABS[currentRole][0][0]);
});
document.getElementById('freecheckSwitch').addEventListener('change', e=>{
  currentFreeCheck = e.target.value;
  render(currentView || TABS[currentRole][0][0]);
});
async function updateIdentitySwitches(){
  const saSwitch = document.getElementById('saSwitch');
  const teknisiSwitch = document.getElementById('teknisiSwitch');
  const foremanSwitch = document.getElementById('foremanSwitch');
  const freecheckSwitch = document.getElementById('freecheckSwitch');
  saSwitch.style.display = currentRole === 'sa' ? '' : 'none';
  teknisiSwitch.style.display = currentRole === 'teknisi' ? '' : 'none';
  foremanSwitch.style.display = currentRole === 'foreman' ? '' : 'none';

async function api(action, method='GET', body=null){
  if(API_URL.includes('PASTE_URL')){
    alert('Prototype mode: API_URL belum di-set. Ini hanya tampilan UI. Set API_URL ke Web App Apps Script untuk fungsi penuh.');
    return { demo:true };
  }
  if(method==='GET'){
    const url = API_URL + '?action=' + action + (body? '&'+new URLSearchParams(body).toString():'');
    return fetch(url).then(r=>r.json());
  }
  return fetch(API_URL, { method:'POST', body: JSON.stringify({action, ...body}) }).then(r=>r.json());
}

let berandaState = { rows: [], itemsJasa: [], itemsSaran: [], filter: 'overall' };
async function renderBeranda(app){
  app.innerHTML = `<div class="card"><p class="note">Memuat dashboard...</p></div>`;
  const [rows, itemsJasa, itemsSaran] = await Promise.all([
    api('listKunjungan'), api('listItemJasa'), api('listItemSaran')
  ]);
  if(!document.getElementById('app')) return; // user sudah pindah role sebelum data selesai dimuat
  if(rows.demo || itemsJasa.demo || itemsSaran.demo){
    app.innerHTML = '<div class="card"><p class="note">Demo mode - hubungkan API untuk data real.</p></div>';
    return;
  }
  berandaState.rows = rows;
  berandaState.itemsJasa = itemsJasa;
  berandaState.itemsSaran = itemsSaran;
  berandaState.disarankanIds = berandaDisarankanIds(itemsJasa, itemsSaran);
  renderBerandaContent(app);
}
// "Disarankan" dihitung dari keberadaan baris Item_Jasa/Item_Saran ASLI, bukan field
// Perlu_FollowUp - field itu ternyata tidak bisa diandalkan (banyak kunjungan lama dengan
// Status_FollowUp sudah Deal/Tidak Deal, jelas-jelas punya baris Jasa/Part, tapi
// Perlu_FollowUp-nya kosong). Ground truth-nya adalah data item itu sendiri.
function berandaDisarankanIds(itemsJasa, itemsSaran){
  const ids = new Set();
  itemsJasa.forEach(j=>{ if(j.ID_Kunjungan) ids.add(j.ID_Kunjungan); });
  itemsSaran.forEach(it=>{ if(it.ID_Kunjungan) ids.add(it.ID_Kunjungan); });
  return ids;
}
// Daftar nama SA yang pernah tercatat di data (dipakai untuk breakdown per SA di
// Dashboard Kepala Bengkel) - diambil dari SELURUH rows (bukan yang sudah difilter
// periode) supaya daftar SA tidak berubah-ubah/hilang saat ganti filter Hari/Minggu/Bulan.
function berandaSaUniverse(rows){
  const set = new Set();
  rows.forEach(r=> set.add(r.SA || '(Tanpa SA)'));
  return [...set].sort();
}
function berandaFilterRows(rows, filterKey){
  if(filterKey === 'overall') return rows;
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfWeek = new Date(startOfDay.getTime() - startOfDay.getDay()*86400000);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const threshold = { hari: startOfDay, minggu: startOfWeek, bulan: startOfMonth }[filterKey];
  return rows.filter(r=>r.Tanggal_Masuk && new Date(r.Tanggal_Masuk) >= threshold);
}
function buildBerandaLeaderboard(rows, field){
  const counts = {};
  rows.forEach(r=>{
    const name = r[field] || '(Kosong)';
    counts[name] = (counts[name]||0) + 1;
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
}
// Setiap tahap di bawah "Unit Disarankan" HARUS dihitung dari populasi "disarankan" itu
// sendiri (bukan dari `rows` mentah), supaya funnel selalu turun/sama.
function berandaIsDeal(status){
  return status === 'Deal - Belum Datang' || status === 'Deal - Sudah Datang';
}
function buildBerandaFunnel(rows, disarankanIds){
  const disarankan = rows.filter(r=>disarankanIds.has(r.ID_Kunjungan));
  return [
    { key:'dikerjakan', label:'Unit Dikerjakan', count: rows.length },
    { key:'disarankan', label:'Unit Disarankan', count: disarankan.length },
    { key:'sudahFollowUp', label:'Sudah Follow Up', count: disarankan.filter(r=>r.Status_FollowUp && r.Status_FollowUp!=='Belum').length },
    { key:'deal', label:'Deal', count: disarankan.filter(r=>berandaIsDeal(r.Status_FollowUp)).length },
    { key:'dealSudahDatang', label:'Deal - Sudah Datang', count: disarankan.filter(r=>r.Status_FollowUp==='Deal - Sudah Datang').length }
  ];
}
// Total nilai rupiah (jasa + part) dari kumpulan ID_Kunjungan tertentu - dipakai baik untuk
// Opportunity (agregat) maupun Penambahan per Mekanik/Foreman/SA (breakdown), supaya
// definisi harga part (Estimasi_Harga Foreman, fallback Harga_Satuan_Teknisi) konsisten.
function berandaRevenueForIds(ids, itemsJasa, itemsSaran){
  const idSet = ids instanceof Set ? ids : new Set(ids);
  let revenue = 0;
  itemsJasa.forEach(j=>{ if(idSet.has(j.ID_Kunjungan)) revenue += Number(j.Harga_Satuan)||0; });
  itemsSaran.forEach(it=>{
    if(idSet.has(it.ID_Kunjungan)){
      const harga = Number(it.Estimasi_Harga) || Number(it.Harga_Satuan_Teknisi) || 0;
      revenue += harga * (Number(it.Qty)||0);
    }
  });
  return revenue;
}
// Opportunity = unit yang ada saran perbaikan TAPI BELUM berhasil dideal-kan & didatangkan
// lagi oleh SA - begitu jadi "Deal - Sudah Datang", unit itu keluar dari sini dan masuk ke
// buildBerandaPenambahan() di bawah (lihat definisi user).
// "No Deal" (final) dan "Tidak Deal" (label lama, sebelum alur direct-to-final ini ada,
// disamakan supaya data lama juga ikut terhitung) sama-sama berarti customer menolak.
function berandaIsLost(status){
  return status === 'No Deal' || status === 'Tidak Deal';
}
function buildBerandaOpportunity(rows, itemsJasa, itemsSaran, disarankanIds){
  const pending = rows.filter(r=>disarankanIds.has(r.ID_Kunjungan) && r.Status_FollowUp!=='Deal - Sudah Datang' && !berandaIsLost(r.Status_FollowUp));
  const ids = pending.map(r=>r.ID_Kunjungan);
  return { unit: pending.length, revenue: berandaRevenueForIds(ids, itemsJasa, itemsSaran) };
}
// Lost Opportunity = unit yang ada saran perbaikan tapi customer-nya menolak (No Deal) -
// nilai jasa/part yang sudah pasti hilang, keluar permanen dari Opportunity di atas.
function buildBerandaLostOpportunity(rows, itemsJasa, itemsSaran, disarankanIds){
  const lost = rows.filter(r=>disarankanIds.has(r.ID_Kunjungan) && berandaIsLost(r.Status_FollowUp));
  const ids = lost.map(r=>r.ID_Kunjungan);
  return { unit: lost.length, revenue: berandaRevenueForIds(ids, itemsJasa, itemsSaran) };
}
// Won Opportunity = versi agregat dari Penambahan di bawah (total lintas Mekanik/Foreman/
// SA) - unit yang berhasil dideal-kan & didatangkan kembali oleh SA.
function buildBerandaWonOpportunity(rows, itemsJasa, itemsSaran, disarankanIds){
  const won = rows.filter(r=>disarankanIds.has(r.ID_Kunjungan) && r.Status_FollowUp==='Deal - Sudah Datang');
  const ids = won.map(r=>r.ID_Kunjungan);
  return { unit: won.length, revenue: berandaRevenueForIds(ids, itemsJasa, itemsSaran) };
}
// Penambahan = unit saran perbaikan yang SUDAH berhasil dideal-kan & didatangkan kembali
// oleh SA (realisasi dari Opportunity di atas), dipecah per Mekanik/Foreman/SA yang menangani.
function buildBerandaPenambahan(rows, itemsJasa, itemsSaran, field, disarankanIds){
  const realized = rows.filter(r=>disarankanIds.has(r.ID_Kunjungan) && r.Status_FollowUp==='Deal - Sudah Datang');
  const byPerson = {};
  realized.forEach(r=>{
    const name = r[field] || '(Kosong)';
    if(!byPerson[name]) byPerson[name] = [];
    byPerson[name].push(r.ID_Kunjungan);
  });
  return Object.entries(byPerson)
    .map(([name,ids])=>({ name, unit: ids.length, revenue: berandaRevenueForIds(ids, itemsJasa, itemsSaran) }))
    .sort((a,b)=>b.unit-a.unit);
}

// Dipetakan sekali di sini supaya Beranda dan breakdown Dashboard Kepala Bengkel
// (agregat maupun per SA) selalu memfilter baris funnel/opportunity dengan definisi
// yang sama persis - lihat showBerandaDrilldown, showKabDrilldown, showKabDrilldownSA.
function berandaRowsForStage(filtered, disarankanIds, key){
  const disarankan = filtered.filter(r=>disarankanIds.has(r.ID_Kunjungan));
  if(key === 'dikerjakan') return filtered;
  if(key === 'disarankan') return disarankan;
  if(key === 'sudahFollowUp') return disarankan.filter(r=>r.Status_FollowUp && r.Status_FollowUp!=='Belum');
  if(key === 'deal') return disarankan.filter(r=>berandaIsDeal(r.Status_FollowUp));
  if(key === 'dealSudahDatang') return disarankan.filter(r=>r.Status_FollowUp==='Deal - Sudah Datang');
  if(key === 'opportunity') return disarankan.filter(r=>r.Status_FollowUp!=='Deal - Sudah Datang' && !berandaIsLost(r.Status_FollowUp));
  if(key === 'lostOpportunity') return disarankan.filter(r=>berandaIsLost(r.Status_FollowUp));
  if(key === 'wonOpportunity') return disarankan.filter(r=>r.Status_FollowUp==='Deal - Sudah Datang');
  return [];
}
function showBerandaDrilldown(key, label){
  const filtered = berandaFilterRows(berandaState.rows, berandaState.filter);
  const rows = berandaRowsForStage(filtered, berandaState.disarankanIds, key);
  renderBerandaDrilldownTable(rows, label);
}

    { key:'Status_FollowUp', label:'Status Follow Up', filterable:true, filterType:'select' }

function sortRows(rows, key, dir){
  const isDateKey = key === 'Tanggal_Masuk' || key === 'Timestamp';
  return [...rows].sort((a,b)=>{
    let av = a[key] || '', bv = b[key] || '';
    if(isDateKey){ av = new Date(av).getTime() || 0; bv = new Date(bv).getTime() || 0; }
    else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
    if(av < bv) return dir === 'asc' ? -1 : 1;
    if(av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

/* ---------- Tabel generik: sortable + filterable per kolom ---------- */
const DT_REGISTRY = {};
function dtInit(containerId, rows, columns, sortKey, emptyMsg){
  DT_REGISTRY[containerId] = { rows, columns, filters: {}, sortKey, sortDir: 'desc', emptyMsg: emptyMsg || 'Tidak ada data.' };
  dtRender(containerId);
}
function dtSort(containerId, key){
  const st = DT_REGISTRY[containerId];
  if(!st) return;
  if(st.sortKey === key) st.sortDir = st.sortDir === 'asc' ? 'desc' : 'asc';
  else { st.sortKey = key; st.sortDir = 'asc'; }
  dtRender(containerId);
}
function dtFilter(containerId, key, value){
  const st = DT_REGISTRY[containerId];
  if(!st) return;
  st.filters[key] = value;
  dtRender(containerId);
}
function dtRender(containerId){
  const st = DT_REGISTRY[containerId];
  const container = document.getElementById(containerId);
  if(!st || !container) return;
  const prevFocused = document.activeElement;
  const prevFocusedId = (prevFocused && prevFocused.id && prevFocused.id.indexOf(containerId+'-f-')===0) ? prevFocused.id : null;
  const prevCaret = (prevFocusedId && typeof prevFocused.selectionStart === 'number') ? prevFocused.selectionStart : null;

  let filtered = st.rows.filter(r => st.columns.every(col => {
    if(!col.filterable) return true;
    const fval = st.filters[col.key];
    if(!fval) return true;
    const rval = String(col.filterValue ? col.filterValue(r) : (r[col.key]||''));
    return col.filterType === 'select' ? rval === fval : rval.toLowerCase().includes(fval.toLowerCase());
  }));
  filtered = sortRows(filtered, st.sortKey, st.sortDir);
  const arrow = key => st.sortKey===key ? (st.sortDir==='asc' ? ' ▲' : ' ▼') : '';

  const headCells = st.columns.map(col => col.sortable===false
    ? `<th>${col.label}</th>`
    : `<th style="cursor:pointer;" onclick="dtSort('${containerId}','${col.key}')">${col.label}${arrow(col.key)}</th>`
  ).join('');
  const filterCells = st.columns.map(col => {
    if(!col.filterable) return '<th></th>';
    const fid = `${containerId}-f-${col.key}`;
    if(col.filterType === 'select'){
      const opts = [...new Set(st.rows.map(r=>(col.filterValue?col.filterValue(r):r[col.key])||'').filter(Boolean))].sort();
      return `<th><select id="${fid}" style="padding:4px 6px;font-size:12px;" onchange="dtFilter('${containerId}','${col.key}',this.value)"><option value="">Semua</option>${opts.map(o=>`<option value="${escapeHtml(o)}" ${st.filters[col.key]===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select></th>`;
    }
    return `<th><input id="${fid}" style="padding:4px 6px;font-size:12px;" placeholder="Cari..." value="${escapeHtml(st.filters[col.key]||'')}" oninput="dtFilter('${containerId}','${col.key}',this.value)"></th>`;
  }).join('');
  const bodyHtml = filtered.length ? filtered.map(r=>`<tr>${st.columns.map(col=>`<td>${col.render?col.render(r):escapeHtml(r[col.key]||'-')}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${st.columns.length}"><p class="note">${st.emptyMsg}</p></td></tr>`;

  container.innerHTML = `
    <div style="overflow-x:auto;">
    <table>
      <thead><tr>${headCells}</tr><tr>${filterCells}</tr></thead>
      <tbody>${bodyHtml}</tbody>
    </table>
    </div>
    <p class="note">${filtered.length} dari ${st.rows.length} data.</p>
  `;
  if(prevFocusedId){
    const el = document.getElementById(prevFocusedId);
    if(el){ el.focus(); if(prevCaret!==null && el.setSelectionRange) el.setSelectionRange(prevCaret, prevCaret); }
  }
}

let masterDataPromise = null;
// updateIdentitySwitches() dan render*() sering memanggil loadMasterData() nyaris bersamaan
// (mis. ganti role -> updateIdentitySwitches() jalan tanpa await, lalu renderTabs() langsung
// memanggil render() yang juga await loadMasterData()). Tanpa dedupe di sini, keduanya sama-sama
// melihat `masterData` masih null lalu SAMA-SAMA menembak fetch action=masterData sendiri-sendiri
// - dan karena Apps Script memproses request masuk secara berurutan (bukan paralel), request
// dobel ini saling antre dan bikin load terasa jauh lebih lama dari yang seharusnya, apalagi kalau
// user keburu klak-klik pindah role lagi selagi masih loading (menambah antrean lagi).
async function loadMasterData(){
  if(masterData) return masterData;
  if(!masterDataPromise){
    masterDataPromise = api('masterData').then(md=>{
      masterData = (md && !md.error) ? md : { Tipe_Mobil:[], Tipe_Service:[], Service_Advisor:[], Teknisi:[], SSC:[], Alasan_SSC:[], Foreman:[], Teknisi_AC_Spooring:[] };
      return masterData;
    }).finally(()=>{ masterDataPromise = null; });
  }
  return masterDataPromise;
}

function formatRibuan(el){
  const digits = el.value.replace(/\D/g,'');
  el.value = digits ? Number(digits).toLocaleString('id-ID') : '';
}
function toRibuan(n){
  n = Number(n) || 0;
  return n ? n.toLocaleString('id-ID') : '';
}
function parseRibuan(str){
  const digits = (str||'').toString().replace(/\D/g,'');
  return digits ? Number(digits) : 0;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function optionList(values){
  return '<option value="">-- Pilih --</option>' + (values||[]).map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');

// Sisipkan `value` ke daftar kalau belum ada - supaya data lama yang nilainya sudah
// tidak ada lagi di MasterData tetap terlihat & tidak diam-diam jadi kosong saat diedit.
function ensureOptionPresent(values, value){
  values = values || [];
  return (value && !values.includes(value)) ? values.concat([value]) : values;
}
// Set value sebuah <select>, dan kalau value itu bukan salah satu <option> yang ada
// (mis. MasterData sudah diubah sejak baris ini dibuat), sisipkan dulu sebagai
// option baru supaya nilai lama tetap terlihat & tidak diam-diam jadi kosong.
function setSelectValuePreserving(selectEl, value){
  if(!value){ selectEl.value = ''; return; }
  if(![...selectEl.options].some(o=>o.value===value)){
    const opt = document.createElement('option');
    opt.value = value; opt.textContent = value;
    selectEl.appendChild(opt);
  }
  selectEl.value = value;
}
function optionListWithOther(values){
  return optionList(values) + '<option value="Others">Others</option>';
}
function toggleOther(selectEl){
  const otherInput = selectEl.nextElementSibling;
  otherInput.style.display = selectEl.value === 'Others' ? '' : 'none';
  if(selectEl.value !== 'Others') otherInput.value = '';
}
function readDropdownWithOther(selectEl){
  return selectEl.value === 'Others' ? selectEl.nextElementSibling.value : selectEl.value;
}
// Sama seperti setSelectValuePreserving, tapi untuk <select> bertipe optionListWithOther
// (punya opsi "Others" + input teks pasangan) - kalau value tidak ada di daftar opsi baku,
// pilih "Others" dan isi input teksnya, alih-alih menyisipkan opsi baru ke dropdown.
function setSelectValueWithOther(selectEl, knownValues, value){
  const otherInput = selectEl.nextElementSibling;
  const isOther = value && !(knownValues||[]).includes(value);
  selectEl.value = isOther ? 'Others' : (value || '');
  if(otherInput){
    otherInput.style.display = isOther ? '' : 'none';
    otherInput.value = isOther ? value : '';
  }
}

function updateTotalParts(){
  const rows = [...document.querySelectorAll('#itemsWrap tr')];
  let total = 0;
  rows.forEach(r => {
    const qty = Number(r.querySelector('.f-qty').value) || 0;
    const harga = parseRibuan(r.querySelector('.f-harga').value);
    total += qty * harga;
  });
  document.getElementById('totalParts').textContent = 'Rp ' + total.toLocaleString('id-ID');
}
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function submitKunjungan(){
  const blocks = [...document.querySelectorAll('#itemsWrap tr')];
  const btn = document.querySelector('main button.primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  try{
    const items = [];
    for(const b of blocks){
      const namaKomponen = b.querySelector('.f-nama').value;
      const qty = b.querySelector('.f-qty').value;
      if(!namaKomponen || !qty) continue;
      const item = { namaKomponen, qty, hargaSatuan: parseRibuan(b.querySelector('.f-harga').value), keterangan: b.querySelector('.f-ket').value, tingkatKeparahan: b.querySelector('.f-keparahan').value, ketersediaanPart: b.querySelector('.f-ketersediaan').value };
      const file = b.querySelector('.f-foto').files[0];
      if(file){
        if(btn) btn.textContent = 'Mengupload foto...';
        const base64Data = await fileToBase64(file);
        const uploadRes = await api('uploadFoto','POST',{ base64Data, mimeType: file.type, fileName: file.name });
        if(uploadRes && uploadRes.url) item.fotoUrl = uploadRes.url;
        else if(uploadRes && uploadRes.error) alert('Gagal upload foto "'+file.name+'": '+uploadRes.error);
        if(btn) btn.textContent = 'Menyimpan...';
      }
      items.push(item);
    }

    const itemsJasa = [];
    for(const b of document.querySelectorAll('#jasaWrap tr')){
      const namaJasa = b.querySelector('.j-nama').value;
      if(!namaJasa) continue;
      itemsJasa.push({
        namaJasa,
        waktu: b.querySelector('.j-waktu').value,
        hargaSatuan: parseRibuan(b.querySelector('.j-harga').value),
        tipeJasa: b.querySelector('.j-tipejasa').value,
        keterangan: b.querySelector('.j-ket').value
      });
    }

    const itemsSSC = [];
    for(const b of document.querySelectorAll('#sscWrap tr')){
      const ssc = b.querySelector('.ssc-name').value;
      if(!ssc) continue;
      itemsSSC.push({
        ssc,
        status: b.querySelector('.ssc-status').value,
        alasan: readDropdownWithOther(b.querySelector('.ssc-alasan'))
      });
    }

    const ujiEmisi = { status: document.getElementById('ujiEmisiStatus').value };
    const ujiEmisiFile = document.getElementById('ujiEmisiFoto').files[0];
    if(ujiEmisiFile){
      if(btn) btn.textContent = 'Mengupload foto uji emisi...';
      const base64Data = await fileToBase64(ujiEmisiFile);
      const uploadRes = await api('uploadFoto','POST',{ base64Data, mimeType: ujiEmisiFile.type, fileName: ujiEmisiFile.name });
      if(uploadRes && uploadRes.url) ujiEmisi.fotoUrl = uploadRes.url;
      else if(uploadRes && uploadRes.error) alert('Gagal upload foto uji emisi: '+uploadRes.error);
      if(btn) btn.textContent = 'Menyimpan...';
    }

    const tipeMobil = readDropdownWithOther(document.getElementById('tipeMobil'));
    const tipeService = document.getElementById('tipeService').value;
    const tanggalService = document.getElementById('tanggalService').value;
    const sa = document.getElementById('sa').value;
    const teknisi = document.getElementById('teknisi').value;
    if(!document.getElementById('noPolisi').value || !tipeMobil || !tipeService || !tanggalService || !sa || !teknisi){
      alert('No. Polisi, Tipe Mobil, Tipe Service, Tanggal Service, Service Advisor, dan Teknisi wajib diisi'); return;
    }
    const proses = {
      pekerjaan: document.getElementById('pekerjaan').value,
      requestCustomer: document.getElementById('requestCustomer').value,
      aki: readChecklist('aki'),
      ban: { ...readChecklist('ban'),
        merk1: document.getElementById('ban-merk1').value, harga1: parseRibuan(document.getElementById('ban-harga1').value),
        merk2: document.getElementById('ban-merk2').value, harga2: parseRibuan(document.getElementById('ban-harga2').value) },
      kampasRem: readChecklist('kampasRem'),
      wiper: readChecklist('wiper'),
      lampu: readChecklist('lampu')
    };
    const hybridHealthCheck = {
      mobilHybrid: document.getElementById('mobilHybrid').value,
      sbe50k100k: document.getElementById('sbe50k100k').value,
      mobil2to5Tahun: document.getElementById('mobil2to5Tahun').value,
      hhc: document.getElementById('hhcStatus').value,
      hasil: document.getElementById('hhcHasil').value
    };
    const body = {
      noPolisi: document.getElementById('noPolisi').value.toUpperCase().split(' ').join(''),
      namaCustomer: document.getElementById('namaCustomer').value,
      noHp: document.getElementById('noHp').value,
      tipeMobil, tipeService,
      tanggalMasuk: tanggalService,
      sa, teknisi,
      proses,
      items,
      itemsJasa,
      hybridHealthCheck,
      sscTerlibat: document.getElementById('sscTerlibat').value,
      itemsSSC,
      ujiEmisi
    };
    const res = await api('createKunjungan','POST',body);
    if(res.demo){
      alert('Demo: data akan tersimpan setelah API terhubung.');
    } else if(res.success){
      document.getElementById('app').innerHTML = teknisiSuccessHtml(res.idKunjungan, body.noPolisi);
      return;
    } else {
      alert('Gagal menyimpan: ' + (res.error || 'unknown error'));
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Simpan & Kirim ke Foreman'; }
  }
}
function teknisiSuccessHtml(idKunjungan, noPolisi){
  return `
  <div class="card">
    <h3>Tersimpan ✓</h3>
    <p>Data untuk <b>${escapeHtml(noPolisi)}</b> (ID: ${idKunjungan}) berhasil disimpan dan masuk antrian Foreman.</p>
    <button class="primary" onclick="printTeknisiReport('${idKunjungan}', this)">Cetak Laporan (Draft)</button>
    <button class="secondary" onclick="render('input')">+ Input Saran Baru Lain</button>
  </div>`;
}
async function printTeknisiReport(idKunjungan, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan PDF...'; }
  try{
    const res = await api('generateReport','POST',{ idKunjungan, printedBy: 'teknisi' });
    if(res && res.pdfUrl) window.open(res.pdfUrl, '_blank');
    else alert('Gagal membuat PDF: ' + (res && res.error ? res.error : 'unknown error'));
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Cetak Laporan (Draft)'; }
  }
}
async function renderRiwayatTeknisi(app){
  if(!requireTeknisi(app)) return;
  app.innerHTML = `<div class="card"><h3>Riwayat Saya</h3><div id="riwayatTeknisiTable">Memuat...</div></div>`;
  const rows = await api('listKunjungan');
  if(!document.getElementById('riwayatTeknisiTable')) return;
  if(rows.demo){ document.getElementById('riwayatTeknisiTable').innerHTML = '<p class="note">Demo mode.</p>'; return; }
  const mine = rows.filter(r=>r.Teknisi===currentTeknisi);
  dtInit('riwayatTeknisiTable', mine, [
    { key:'No_Polisi', label:'No. Polisi', filterable:true, filterType:'text' },
    { key:'Nama_Customer', label:'Customer', filterable:true, filterType:'text' },
    { key:'Tanggal_Masuk', label:'Tanggal', filterable:false, render:r=>r.Tanggal_Masuk?toDateInputValue(r.Tanggal_Masuk):'-' },
    { key:'Tipe_Service', label:'Tipe Service', filterable:true, filterType:'select' },
    { key:'Status', label:'Status', filterable:true, filterType:'select', render:r=>`<span class="badge ${statusBadgeClass(r.Status)}">${escapeHtml(r.Status)}</span>` },
    { key:'aksi', label:'', sortable:false, filterable:false, render:r=>`<button type="button" class="secondary" onclick="printTeknisiReport('${r.ID_Kunjungan}', this)">Cetak (Draft)</button>` }
  ], 'Tanggal_Masuk');
}

  const rows = await api('listKunjungan');

  if(!queue) return; // pengguna sudah pindah tab sebelum data selesai dimuat
  if(rows.demo){ queue.innerHTML='<p class="note">Demo mode - hubungkan API untuk data real.</p>'; return; }
  // Menerima status lama "Menunggu Partman" juga, supaya kunjungan yang sudah ada sebelum
  // rename Partman->Foreman tidak hilang dari antrian.
  const waiting = rows.filter(r=>r.Status==='Menunggu Foreman' || r.Status==='Menunggu Partman');

    <div class="queue-item" data-id="${r.ID_Kunjungan}" onclick="selectForemanQueueItem('${r.ID_Kunjungan}', this)">

}

async function saveForemanJasaRow(btn){
  const tr = btn.closest('tr');
  const id = tr.dataset.id;
  const namaJasa = tr.querySelector('.fj-nama').value;
  const waktu = tr.querySelector('.fj-waktu').value;
  const hargaSatuan = parseRibuan(tr.querySelector('.fj-harga').value);
  const tipeJasa = tr.querySelector('.fj-tipejasa').value;
  const keterangan = tr.querySelector('.fj-ket').value;
  let res;
  if(!id){
    res = await api('addItemJasa','POST',{ idKunjungan: currentDetailId, namaJasa, waktu, hargaSatuan, tipeJasa, keterangan });
    if(res.success) tr.dataset.id = res.idJasa;
  } else {
    res = await api('updateRow','POST',{ sheet:'Item_Jasa', id, fields:{
      Nama_Jasa: namaJasa, Waktu: waktu, Harga_Satuan: hargaSatuan, Tipe_Jasa: tipeJasa, Keterangan: keterangan
    }});
  }
  btn.textContent = res.success ? 'Tersimpan ✓' : 'Gagal';
}
async function deleteForemanJasaRow(btn){
  const tr = btn.closest('tr');
  const id = tr.dataset.id;
  if(id){
    if(!confirm('Hapus baris jasa ini?')) return;
    await api('deleteRow','POST',{ sheet:'Item_Jasa', id });
  }
  tr.remove();
}

function isThisWeek(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr);
  if(isNaN(d)) return false;
  const now = new Date();
  const startOfWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
  const endOfWeek = new Date(startOfWeek.getFullYear(), startOfWeek.getMonth(), startOfWeek.getDate() + 7);
  return d >= startOfWeek && d < endOfWeek;
}
function addDaysISO(dateStr, days){
  const d = dateStr ? new Date(dateStr) : new Date();
  if(isNaN(d)) return toDateInputValue(new Date());
  d.setDate(d.getDate() + days);
  return toDateInputValue(d);
}
// Nomor HP customer -> link WhatsApp click-to-chat (08xx/+62xx/62xx semua dinormalisasi ke 62xx)
function waLink(phone, message){
  if(!phone) return '';
  let p = String(phone).replace(/[^0-9]/g,'');
  if(!p) return '';
  if(p.startsWith('0')) p = '62' + p.slice(1);
  else if(!p.startsWith('62')) p = '62' + p;
  let url = 'https://wa.me/' + p;
  if(message) url += '?text=' + encodeURIComponent(message);
  return url;
}
function formatRupiah(n){
  return 'Rp ' + (Number(n)||0).toLocaleString('id-ID');
}
function formatTanggalIndo(dateVal){
  const iso = toDateInputValue(dateVal);
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
// Template pesan follow up WA - lihat "Template Chat WA.md" dari SGA (rincian jasa/part +
// total estimasi + diskon booking 10%), bukan pesan generik. Butuh detail Item_Jasa/Item_Saran
// yang tidak ikut terbawa di listKunjungan(), makanya di-fetch on-demand saat tombol diklik.
function buildFollowUpWaMessage(kj, itemsJasa, items){
  const nama = kj.Nama_Customer || 'Bapak/Ibu';
  const tglService = formatTanggalIndo(kj.Tanggal_Masuk);
  const jasaLines = (itemsJasa||[]).filter(j=>j.Nama_Jasa).map(j=>`*${j.Nama_Jasa}* = *${formatRupiah(j.Harga_Satuan)}*`);
  const totalJasa = (itemsJasa||[]).reduce((s,j)=>s+(Number(j.Harga_Satuan)||0), 0);
  const hargaPart = it => Number(it.Estimasi_Harga) || Number(it.Harga_Satuan_Teknisi) || 0;
  const partLines = (items||[]).filter(it=>it.Nama_Komponen).map(it=>{
    const qty = Number(it.Qty) || 0;
    return `*- ${it.Nama_Komponen}* : *${qty}pcs* x *${formatRupiah(hargaPart(it))}* = *${formatRupiah(hargaPart(it)*qty)}*`;
  });
  const totalPart = (items||[]).reduce((s,it)=>s+hargaPart(it)*(Number(it.Qty)||0), 0);
  const totalEstimasi = totalJasa + totalPart;

  return [
    `Selamat pagi Bpk/Ibu *${nama}*`,
    `Kami dari Daya Toyota Bekasi, mengingatkan kembali saran perbaikan pada saat service *${tglService}* dengan rincian sbb :`,
    '',
    jasaLines.length ? jasaLines.join('\n') : '-',
    '',
    partLines.length ? partLines.join('\n') : '-',
    '',
    `*Total Estimasi Harga: ${formatRupiah(totalEstimasi)}*`,
    '',
    `Special untuk Bpk/Ibu *${nama}*, kami berikan *Diskon Jasa 10%* jika melakukan booking.`,
    'Jika berkenan melakukan booking untuk perbaikan *silahkan menghubungi saya di nomor ini*.',
    'Terima Kasih',
    '',
    'Salam Hangat',
    `*${currentSA || '-'}*`,
    'Service Advisor'
  ].join('\n');
}

  const win = window.open('', '_blank');

function followUpDetailTableHtml(itemsJasa, items){
  const hargaPart = it => Number(it.Estimasi_Harga) || Number(it.Harga_Satuan_Teknisi) || 0;
  let totalJasa = 0, totalPart = 0;
  const jasaRows = itemsJasa.filter(j=>j.Nama_Jasa).map(j=>{
    const harga = Number(j.Harga_Satuan) || 0;
    totalJasa += harga;
    return `<tr><td>${escapeHtml(j.Nama_Jasa)}</td><td>${escapeHtml(j.Waktu||'-')}</td><td>${formatRupiah(harga)}</td><td>${escapeHtml(j.Tipe_Jasa||'Reguler')}</td><td>${escapeHtml(j.Keterangan||'-')}</td></tr>`;
  }).join('');
  const partRows = items.filter(it=>it.Nama_Komponen).map(it=>{
    const qty = Number(it.Qty) || 0;
    const harga = hargaPart(it);
    totalPart += harga * qty;
    return `<tr><td>${escapeHtml(it.Nama_Komponen)}</td><td>${qty}</td><td>${formatRupiah(harga)}</td><td>${formatRupiah(harga*qty)}</td><td>${escapeHtml(it.Tingkat_Keparahan||'-')}</td><td>${escapeHtml(it.Keterangan_Partman||it.Keterangan_Teknisi||'-')}</td></tr>`;
  }).join('');
  if(!jasaRows && !partRows) return '<p class="note">Tidak ada saran perbaikan.</p>';
  return `
    ${jasaRows ? `
    <p class="note" style="margin-bottom:4px;"><b>Nama Jasa</b></p>
    <div style="overflow-x:auto;"><table class="items-table">
      <thead><tr><th>Nama Jasa</th><th>Waktu</th><th>Harga Satuan</th><th>Tipe Jasa</th><th>Keterangan</th></tr></thead>
      <tbody>${jasaRows}</tbody>
    </table></div>` : ''}
    ${partRows ? `
    <p class="note" style="margin:12px 0 4px;"><b>Nama Parts</b></p>
    <div style="overflow-x:auto;"><table class="items-table">
      <thead><tr><th>Nama Parts</th><th>Qty</th><th>Harga Satuan</th><th>Total</th><th>Tingkat Keparahan</th><th>Keterangan</th></tr></thead>
      <tbody>${partRows}</tbody>
    </table></div>` : ''}
    <p class="note" style="margin-top:8px;"><b>Total Estimasi Saran Perbaikan: ${formatRupiah(totalJasa+totalPart)}</b></p>
  `;
}

// Kelompokkan kunjungan seorang SA (atau semua SA kalau saName falsy) ke bucket-bucket
// antrian Follow Up - dipakai baik oleh layar Follow Up SA sendiri maupun rekap total/
// breakdown per SA di Dashboard Kepala Bengkel, supaya definisi "perlu follow up hari
// ini/lewat jatuh tempo/dst" selalu identik di kedua tempat.
function computeFollowUpBuckets(rows, saName){
  const todayStr = toDateInputValue(new Date());
  // Tidak Deal langsung final ("No Deal") - tidak lagi diantre ulang, jadi hanya status
  // "Belum" yang masih aktif menunggu tindakan SA. "Tidak Deal" tetap dicek di sini supaya
  // data lama (sebelum perubahan ini) yang masih berstatus "Tidak Deal" tidak nyangkut di
  // antrian aktif - langsung dianggap setara "No Deal" juga.
  const mine = rows.filter(r=>(!saName || r.SA===saName) && r.Status==='Report Terkirim' && r.FollowUp_Dikonfirmasi==='Ya' && r.Perlu_FollowUp!=='Tidak');
  const pending = mine.filter(r=>(r.Status_FollowUp||'Belum') === 'Belum');
  const rencanaStr = r => toDateInputValue(r.Tanggal_FollowUp_Rencana);
  const konfirmasi = rows.filter(r=>(!saName || r.SA===saName) && r.Status==='Report Terkirim' && r.FollowUp_Dikonfirmasi!=='Ya' && r.Perlu_FollowUp!=='Tidak');
  return {
    konfirmasi,
    hari: pending.filter(r=>rencanaStr(r) === todayStr),
    overdue: pending.filter(r=>rencanaStr(r) && rencanaStr(r) < todayStr),
    upcoming: pending.filter(r=>rencanaStr(r) && rencanaStr(r) > todayStr),
    dealBelumDatang: mine.filter(r=>r.Status_FollowUp === 'Deal - Belum Datang'),
    dealMinggu: mine.filter(r=>r.Status_FollowUp==='Deal - Sudah Datang' && isThisWeek(r.Tanggal_Kedatangan_Aktual)),
    noDeal: mine.filter(r=>r.Status_FollowUp==='No Deal' || r.Status_FollowUp==='Tidak Deal')
  };
}
let followUpState = { filter: null, rows: [] };
async function renderFollowUp(app){
  if(!requireSA(app)) return;
  app.innerHTML = `<div class="card"><h3>Follow Up Customer</h3><div id="list">Memuat...</div></div>`;
  const rows = await api('listKunjungan');
  const list = document.getElementById('list');
  if(rows.demo){ list.innerHTML='<p class="note">Demo mode.</p>'; return; }
  const b = computeFollowUpBuckets(rows, currentSA);

  // Baris "Belum" yang punya Alasan_ReFollowUp berarti sudah pernah di-follow-up dan
  // dijadwalkan ulang oleh SA (bukan follow up pertama) - ditandai beda supaya kelihatan.
  const decorate = (arr, kategori, badgeLabel, badgeClass) => arr.map(r=>{
    const isRefollow = kategori !== 'dealBelumDatang' && kategori !== 'dealMinggu' && kategori !== 'noDeal' && !!r.Alasan_ReFollowUp;
    return { ...r, _kategori:kategori,
      _badgeLabel: isRefollow ? badgeLabel+' (Re-Follow Up)' : badgeLabel,
      _badgeClass: isRefollow ? 'refollow' : badgeClass,
      _isRefollow: isRefollow };
  });
  followUpState.rows = [
    ...decorate(b.hari, 'hari', 'Hari Ini', 'wait'),
    ...decorate(b.overdue, 'overdue', 'Lewat Jatuh Tempo', 'overdue'),
    ...decorate(b.upcoming, 'upcoming', 'Belum Jatuh Tempo', 'wait'),
    ...decorate(b.dealBelumDatang, 'dealBelumDatang', 'Deal - Belum Datang', 'sent'),
    ...decorate(b.dealMinggu, 'dealMinggu', 'Deal - Sudah Datang', 'sent'),
    ...decorate(b.noDeal, 'noDeal', 'No Deal', 'overdue')
  ];
  followUpState.filter = null;

  list.innerHTML = `
    <div class="kpi" style="margin-bottom:22px;">
      <div class="box filterable" data-key="konfirmasi" onclick="goToKonfirmasiSA()" title="Buka menu Perlu Dikonfirmasi"><div class="num">${b.konfirmasi.length}</div><div class="lbl">Perlu Dikonfirmasi</div></div>
      <div class="box warning filterable" data-key="hari" onclick="setFollowUpFilter('hari')"><div class="num">${b.hari.length}</div><div class="lbl">Perlu Follow Up Hari Ini</div></div>
      <div class="box filterable" data-key="overdue" onclick="setFollowUpFilter('overdue')"><div class="num">${b.overdue.length}</div><div class="lbl">Lewat Jatuh Tempo</div></div>
      <div class="box filterable" data-key="upcoming" onclick="setFollowUpFilter('upcoming')"><div class="num">${b.upcoming.length}</div><div class="lbl">Belum Jatuh Tempo</div></div>
      <div class="box info filterable" data-key="dealBelumDatang" onclick="setFollowUpFilter('dealBelumDatang')"><div class="num">${b.dealBelumDatang.length}</div><div class="lbl">Deal Belum Datang</div></div>
      <div class="box success filterable" data-key="dealMinggu" onclick="setFollowUpFilter('dealMinggu')"><div class="num">${b.dealMinggu.length}</div><div class="lbl">Deal Minggu Ini</div></div>
      <div class="box filterable" data-key="noDeal" onclick="setFollowUpFilter('noDeal')"><div class="num">${b.noDeal.length}</div><div class="lbl">No Deal</div></div>
    </div>
    <p class="note">Klik salah satu kartu di atas untuk memfilter tabel di bawah; klik lagi kartu yang sama untuk menampilkan semua. Klik "Update" pada baris untuk mengubah status follow up-nya - baris lain tidak akan terbuka.</p>
    <div id="followUpEditPanel"></div>
    <div id="followUpTable"></div>
  `;
  renderFollowUpTable();
}

}
async function saveFollowUpOutcome(id){
  const status = document.getElementById('fu-status-'+id).value;
  if(!status){ alert('Pilih status follow up dulu'); return; }
  const fields = { Status_FollowUp: status, Tanggal_FollowUp_Aktual: new Date().toISOString() };
  if(status === 'Tidak Deal'){
    const alasan = readDropdownWithOther(document.getElementById('fu-alasan-'+id));
    if(!alasan){ alert('Pilih alasan Tidak Deal dulu'); return; }
    // Tidak Deal langsung final - tidak ada lagi jadwal follow up berikutnya, unit keluar
    // dari antrian aktif (lihat pendingStatuses di renderFollowUp) tapi tetap ada di riwayat.
    fields.Status_FollowUp = 'No Deal';
    fields.Alasan_Tidak_Deal = alasan;
  } else if(status === 'Deal'){
    const tglDatang = document.getElementById('fu-tgldatang-'+id).value;
    if(!tglDatang){ alert('Tanggal rencana datang wajib diisi'); return; }
    fields.Status_FollowUp = 'Deal - Belum Datang';
    fields.Tanggal_Rencana_Datang = tglDatang;
    fields.Jam_Rencana_Datang = document.getElementById('fu-jamdatang-'+id).value || '';
  } else if(status === 'Re-Follow Up'){
    const tglBaru = document.getElementById('fu-refollow-tgl-'+id).value;
    if(!tglBaru){ alert('Tanggal follow up ulang wajib diisi'); return; }
    const alasan = readDropdownWithOther(document.getElementById('fu-refollow-alasan-'+id));
    if(!alasan){ alert('Pilih alasan follow up ulang dulu'); return; }
    // Kembali ke antrian aktif ("Belum") dengan tanggal baru - alasan/catatan disimpan supaya
    // muncul sebagai "hasil follow up sebelumnya" saat baris ini tampil lagi di antrian.
    fields.Status_FollowUp = 'Belum';
    fields.Tanggal_FollowUp_Rencana = tglBaru;
    fields.Alasan_ReFollowUp = alasan;
    fields.Catatan_ReFollowUp = document.getElementById('fu-refollow-catatan-'+id).value || '';
  }
  const res = await api('updateRow','POST',{ sheet:'Kunjungan', id, fields });
  if(res.success){ renderFollowUp(document.getElementById('app')); }
  else alert('Gagal menyimpan: '+(res.error||'unknown error'));
}

}

  const jenisKendaraan = readDropdownWithOther(document.getElementById('cspJenis'));
  const hasilPengecekan = document.getElementById('cspHasil').value;
  if(!noPolisi || !jenisKendaraan || !hasilPengecekan){
    alert('Semua field wajib diisi'); return;
  }
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try{
    const res = await api('createCheckSpooring','POST',{
      noPolisi: noPolisi.toUpperCase().split(' ').join(''), jenisKendaraan, teknisi: currentFreeCheck, hasilPengecekan
    });
    if(res.demo){ alert('Demo: data akan tersimpan setelah API terhubung.'); }
    else if(res.success){ alert('Free Check Spooring tersimpan.'); render('checkspooring'); }
    else alert('Gagal menyimpan: '+(res.error||'unknown error'));
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}
async function renderRiwayatCheck(app){

    <div class="card"><h3>Riwayat Free Check Up AC</h3><div id="riwayatCheckACTable">Memuat...</div></div>

  `;
  const [ac, spooring] = await Promise.all([api('listCheckAC'), api('listCheckSpooring')]);
  if(!document.getElementById('riwayatCheckACTable')) return;

    document.getElementById('riwayatCheckACTable').innerHTML = '<p class="note">Demo mode.</p>';
    document.getElementById('riwayatCheckSpooringTable').innerHTML = '<p class="note">Demo mode.</p>';

  const mineAC = ac.filter(r=>r.Teknisi===currentFreeCheck);
  const mineSpooring = spooring.filter(r=>r.Teknisi===currentFreeCheck);

/* ---------- DASHBOARD KEPALA BENGKEL - disinkronkan dengan Beranda: sama-sama
   pakai listKunjungan/listItemJasa/listItemSaran mentah + fungsi buildBeranda*
   sehingga funnel/opportunity di sini dijamin sama persis dengan Beranda, hanya
   ditambah breakdown per SA dan rekap total dashboard Follow Up SA. ---------- */
let kabState = { rows: [], itemsJasa: [], itemsSaran: [], disarankanIds: null, filter: 'overall', dashboard: null };
async function renderDashboard(app){
  app.innerHTML = `<div class="card"><p class="note">Memuat dashboard...</p></div>`;
  const [d, rows, itemsJasa, itemsSaran] = await Promise.all([
    api('dashboard'), api('listKunjungan'), api('listItemJasa'), api('listItemSaran')
  ]);
  if(!document.getElementById('app')) return;
  if(d.demo || rows.demo || itemsJasa.demo || itemsSaran.demo){
    app.innerHTML = '<div class="card"><p class="note">Demo mode - hubungkan API untuk data real.</p></div>';
    return;
  }
  kabState.dashboard = d;
  kabState.rows = rows;
  kabState.itemsJasa = itemsJasa;
  kabState.itemsSaran = itemsSaran;
  kabState.disarankanIds = berandaDisarankanIds(itemsJasa, itemsSaran);
  renderKabengkelContent(app);
}
function setKabFilter(key){
  kabState.filter = key;
  const panel = document.getElementById('kabDrilldown');
  if(panel) panel.innerHTML = '';
  renderKabengkelContent(document.getElementById('app'));
}
function kabFunnelPerSA(rows, disarankanIds){
  return berandaSaUniverse(rows).map(sa=>({
    sa, funnel: buildBerandaFunnel(rows.filter(r=>(r.SA||'(Tanpa SA)')===sa), disarankanIds)
  }));
}
function kabOpportunityPerSA(rows, itemsJasa, itemsSaran, disarankanIds){
  return berandaSaUniverse(rows).map(sa=>{
    const subset = rows.filter(r=>(r.SA||'(Tanpa SA)')===sa);
    return {
      sa,
      opportunity: buildBerandaOpportunity(subset, itemsJasa, itemsSaran, disarankanIds),
      lost: buildBerandaLostOpportunity(subset, itemsJasa, itemsSaran, disarankanIds),
      won: buildBerandaWonOpportunity(subset, itemsJasa, itemsSaran, disarankanIds)
    };
  });
}
function kabFollowUpPerSA(rows){
  return berandaSaUniverse(rows).map(sa=>({ sa, b: computeFollowUpBuckets(rows, sa) }));
}
function kabFunnelTableHtml(perSA){
  const rowsHtml = perSA.map(({sa,funnel})=>{
    const cells = funnel.map(f=>`<td class="clickable" data-sa="${escapeHtml(sa)}" data-stage="${f.key}" data-label="${escapeHtml(f.label)} - ${escapeHtml(sa)}">${f.count}</td>`).join('');
    return `<tr><td>${escapeHtml(sa)}</td>${cells}</tr>`;
  }).join('') || `<tr><td colspan="6" class="note">Tidak ada data.</td></tr>`;
  const heads = ['Unit Dikerjakan','Unit Disarankan','Sudah Follow Up','Deal','Deal - Sudah Datang'].map(l=>`<th>${l}</th>`).join('');
  return `<div class="breakdown-table"><table><thead><tr><th>SA</th>${heads}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
function kabOpportunityTableHtml(perSA){
  const rowsHtml = perSA.map(row=>`<tr>
    <td>${escapeHtml(row.sa)}</td>
    <td class="clickable" data-sa="${escapeHtml(row.sa)}" data-stage="opportunity" data-label="Opportunity - ${escapeHtml(row.sa)}">${row.opportunity.unit} unit<br><span class="note">${formatRupiah(row.opportunity.revenue)}</span></td>
    <td class="clickable" data-sa="${escapeHtml(row.sa)}" data-stage="lostOpportunity" data-label="Lost Opportunity - ${escapeHtml(row.sa)}">${row.lost.unit} unit<br><span class="note">${formatRupiah(row.lost.revenue)}</span></td>
    <td class="clickable" data-sa="${escapeHtml(row.sa)}" data-stage="wonOpportunity" data-label="Won Opportunity - ${escapeHtml(row.sa)}">${row.won.unit} unit<br><span class="note">${formatRupiah(row.won.revenue)}</span></td>
  </tr>`).join('') || `<tr><td colspan="4" class="note">Tidak ada data.</td></tr>`;
  return `<div class="breakdown-table"><table><thead><tr><th>SA</th><th>Opportunity</th><th>Lost Opportunity</th><th>Won Opportunity</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
const KAB_FU_COLS = [['konfirmasi','Perlu Dikonfirmasi'],['hari','Follow Up Hari Ini'],['overdue','Lewat Jatuh Tempo'],
  ['upcoming','Belum Jatuh Tempo'],['dealBelumDatang','Deal Belum Datang'],['dealMinggu','Deal Minggu Ini'],['noDeal','No Deal']];
function kabFollowUpTableHtml(perSA){
  const rowsHtml = perSA.map(({sa,b})=>{
    const cells = KAB_FU_COLS.map(([key,label])=>`<td class="clickable" data-sa="${escapeHtml(sa)}" data-fukey="${key}" data-label="${label} - ${escapeHtml(sa)}">${b[key].length}</td>`).join('');
    return `<tr><td>${escapeHtml(sa)}</td>${cells}</tr>`;
  }).join('') || `<tr><td colspan="8" class="note">Tidak ada data.</td></tr>`;
  return `<div class="breakdown-table"><table><thead><tr><th>SA</th>${KAB_FU_COLS.map(([,l])=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
function showKabDrilldown(key, label){
  const filtered = berandaFilterRows(kabState.rows, kabState.filter);
  const rows = berandaRowsForStage(filtered, kabState.disarankanIds, key);
  renderDrilldownTable('kabDrilldown', rows, label);
}
function showKabDrilldownSA(saName, key, label){
  const filtered = berandaFilterRows(kabState.rows, kabState.filter).filter(r=>(r.SA||'(Tanpa SA)')===saName);
  const rows = berandaRowsForStage(filtered, kabState.disarankanIds, key);
  renderDrilldownTable('kabDrilldown', rows, label);
}
// Rekap Follow Up SA sengaja TIDAK ikut filter periode Hari/Minggu/Bulan di atas - ini
// snapshot antrian follow up "saat ini" (persis definisi di layar Follow Up milik SA
// sendiri), bukan unit yang masuk bengkel pada periode tertentu.
function showKabFollowUpDrilldown(saName, fuKey, label){
  const b = computeFollowUpBuckets(kabState.rows, saName || null);
  renderDrilldownTable('kabDrilldown', b[fuKey], label);
}
function bindKabBreakdownClicks(containerId, onCell){
  const el = document.getElementById(containerId);
  if(!el) return;
  [...el.querySelectorAll('td.clickable')].forEach(td=>{
    td.addEventListener('click', ()=> onCell(td.dataset));
  });
}
function renderKabengkelContent(app){
  const d = kabState.dashboard;
  const filtered = berandaFilterRows(kabState.rows, kabState.filter);
  const disarankanIds = kabState.disarankanIds;
  const funnel = buildBerandaFunnel(filtered, disarankanIds);
  const opportunity = buildBerandaOpportunity(filtered, kabState.itemsJasa, kabState.itemsSaran, disarankanIds);
  const lostOpportunity = buildBerandaLostOpportunity(filtered, kabState.itemsJasa, kabState.itemsSaran, disarankanIds);
  const wonOpportunity = buildBerandaWonOpportunity(filtered, kabState.itemsJasa, kabState.itemsSaran, disarankanIds);
  const funnelPerSA = kabFunnelPerSA(filtered, disarankanIds);
  const opportunityPerSA = kabOpportunityPerSA(filtered, kabState.itemsJasa, kabState.itemsSaran, disarankanIds);
  const fuTotal = computeFollowUpBuckets(kabState.rows, null);
  const fuPerSA = kabFollowUpPerSA(kabState.rows);
  const filterBtn = (key,label) => `<button type="button" class="secondary" onclick="setKabFilter('${key}')" style="${kabState.filter===key?'background:var(--primary-50);color:var(--primary-700);font-weight:600;':''}">${label}</button>`;

  app.innerHTML = `
    <div class="card">
      <h3>Dashboard Kepala Bengkel</h3>
      <p class="note">Sinkron dengan Beranda. Klik kartu funnel/opportunity/follow up atau sel breakdown per SA untuk lihat daftar unitnya.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
        ${filterBtn('hari','Hari Ini')}
        ${filterBtn('minggu','Minggu Ini')}
        ${filterBtn('bulan','Bulan Ini')}
        ${filterBtn('overall','Semua')}
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>Funnel Unit</h3>
      <div class="kpi">
        ${funnel.map(f=>`
          <div class="box filterable" style="cursor:pointer;" onclick='showKabDrilldown("${f.key}", "${escapeHtml(f.label)}")'>
            <div class="num">${f.count}</div>
            <div class="lbl">${f.label}</div>
          </div>`).join('')}
      </div>
      <p class="note" style="margin-top:14px;">Total tiap tahap = panjang bar (lihat juga angka di kartu di atas); warna = kontribusi tiap SA. Klik salah satu segmen untuk lihat detail unitnya.</p>
      <div class="chart-wrap" style="height:280px;"><canvas id="kabFunnelChart"></canvas></div>
      <h4 style="margin-top:18px;">Breakdown per SA</h4>
      <div id="kabFunnelPerSA">${kabFunnelTableHtml(funnelPerSA)}</div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>Opportunity</h3>
      <p class="note">Sama seperti di Beranda - unit yang ada saran perbaikan (Opportunity: masih menunggu, Lost: customer bilang No Deal, Won: berhasil didatangkan kembali).</p>
      <div class="kpi">
        <div class="box filterable info" style="cursor:pointer;" onclick="showKabDrilldown('opportunity', 'Opportunity - Belum Deal')">
          <div class="num">${opportunity.unit}</div>
          <div class="lbl">Opportunity Unit</div>
          <div class="note" style="margin-top:6px;">${formatRupiah(opportunity.revenue)}</div>
        </div>
        <div class="box filterable" style="cursor:pointer;" onclick="showKabDrilldown('lostOpportunity', 'Lost Opportunity - No Deal')">
          <div class="num">${lostOpportunity.unit}</div>
          <div class="lbl">Lost Opportunity Unit</div>
          <div class="note" style="margin-top:6px;">${formatRupiah(lostOpportunity.revenue)}</div>
        </div>
        <div class="box filterable success" style="cursor:pointer;" onclick="showKabDrilldown('wonOpportunity', 'Won Opportunity - Sudah Datang')">
          <div class="num">${wonOpportunity.unit}</div>
          <div class="lbl">Won Opportunity Unit</div>
          <div class="note" style="margin-top:6px;">${formatRupiah(wonOpportunity.revenue)}</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="kabOppChart"></canvas></div>
      <h4 style="margin-top:18px;">Breakdown per SA</h4>
      <div id="kabOppPerSA">${kabOpportunityTableHtml(opportunityPerSA)}</div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>Rekap Dashboard Follow Up SA</h3>
      <p class="note">Snapshot antrian Follow Up seluruh SA saat ini (tidak mengikuti filter periode di atas) - persis seperti yang dilihat masing-masing SA di menu Follow Up mereka.</p>
      <div class="kpi">
        ${KAB_FU_COLS.map(([key,label])=>`
          <div class="box filterable" style="cursor:pointer;" onclick="showKabFollowUpDrilldown('', '${key}', '${label}')">
            <div class="num">${fuTotal[key].length}</div>
            <div class="lbl">${label}</div>
          </div>`).join('')}
      </div>
      <h4 style="margin-top:18px;">Breakdown per SA</h4>
      <div id="kabFuPerSA">${kabFollowUpTableHtml(fuPerSA)}</div>
    </div>

    <div class="card" style="margin-top:16px;"><h3>Daftar Kunjungan</h3><p class="note">Mengikuti filter periode di atas.</p><div id="dashboardTable"></div></div>

    <div class="card" style="margin-top:16px;"><h3>Free Check Up AC &amp; Spooring</h3>
    <div class="kpi">
      <div class="box"><div class="num">${d.totalCheckAC.total}</div><div class="lbl">Total Check Up AC</div></div>
      <div class="box"><div class="num">${d.totalCheckAC.hariIni}</div><div class="lbl">Check Up AC Hari Ini</div></div>
      <div class="box"><div class="num">${d.totalCheckSpooring.total}</div><div class="lbl">Total Check Spooring</div></div>
      <div class="box"><div class="num">${d.totalCheckSpooring.hariIni}</div><div class="lbl">Check Spooring Hari Ini</div></div>
    </div></div>

    <div id="kabDrilldown"></div>
  `;
  renderDashboardTable(filtered);
  renderStackedFunnelChart('kabFunnelChart', funnel.map(f=>f.key), funnel.map(f=>f.label),
    funnelPerSA.map(row=>({ name: row.sa, data: row.funnel.map(f=>f.count) })),
    (saName, stageKey) => {
      const stage = funnel.find(f=>f.key===stageKey);
      showKabDrilldownSA(saName, stageKey, (stage?stage.label:stageKey) + ' - ' + saName);
    });
  renderBarChart('kabOppChart', ['Opportunity','Lost Opportunity','Won Opportunity'],
    [opportunity.unit, lostOpportunity.unit, wonOpportunity.unit], CHART_COLORS_OPPORTUNITY);
  bindKabBreakdownClicks('kabFunnelPerSA', ds => showKabDrilldownSA(ds.sa, ds.stage, ds.label));
  bindKabBreakdownClicks('kabOppPerSA', ds => showKabDrilldownSA(ds.sa, ds.stage, ds.label));
  bindKabBreakdownClicks('kabFuPerSA', ds => showKabFollowUpDrilldown(ds.sa, ds.fukey, ds.label));
}
function renderDashboardTable(filtered){
  if(!document.getElementById('dashboardTable')) return;
  dtInit('dashboardTable', filtered, [
    { key:'No_Polisi', label:'No. Polisi', filterable:true, filterType:'text' },
    { key:'Nama_Customer', label:'Customer', filterable:true, filterType:'text' },
    { key:'Tanggal_Masuk', label:'Tanggal', filterable:false, render:r=>r.Tanggal_Masuk?toDateInputValue(r.Tanggal_Masuk):'-' },
    { key:'SA', label:'SA', filterable:true, filterType:'select' },
    { key:'Teknisi', label:'Teknisi', filterable:true, filterType:'select' },
    { key:'Status', label:'Status', filterable:true, filterType:'select', render:r=>`<span class="badge ${statusBadgeClass(r.Status)}">${escapeHtml(r.Status)}</span>` },
    { key:'Status_FollowUp', label:'Status Follow Up', filterable:true, filterType:'select' }
  ], 'Tanggal_Masuk');
}
async function renderSemua(app){
  app.innerHTML = `<div class="card"><h3>Semua Kunjungan</h3><div id="list">Memuat...</div></div>`;
  const rows = await api('listKunjungan');
  const list = document.getElementById('list');
  if(rows.demo){ list.innerHTML='<p class="note">Demo mode.</p>'; return; }
  list.innerHTML = `<table><tr><th>No Polisi</th><th>Customer</th><th>SA</th><th>Teknisi</th><th>Status</th></tr>` +
    rows.map(r=>`<tr><td>${r.No_Polisi}</td><td>${r.Nama_Customer}</td><td>${r.SA}</td><td>${r.Teknisi}</td><td>${r.Status}</td></tr>`).join('') +
    `</table>`;
}

updateIdentitySwitches();
renderTabs();
