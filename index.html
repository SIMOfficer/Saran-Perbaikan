<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>DA-SAR - Daya Saran Perbaikan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--primary:#c0392b;--dark:#2c3e50;--bg:#f4f6f8;--ok:#27ae60;--warn:#e67e22;}
  *{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
  body{margin:0;background:var(--bg);color:#222;}
  header{background:var(--dark);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{font-size:18px;margin:0;white-space:nowrap;}
  header h1 .subtitle{display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:2px;white-space:nowrap;}
  header select{width:auto;max-width:220px;}
  nav{display:flex;gap:4px;background:#fff;padding:0 24px;border-bottom:1px solid #ddd;}
  nav button{border:none;background:none;padding:14px 18px;cursor:pointer;font-size:14px;color:#555;border-bottom:3px solid transparent;}
  nav button.active{color:var(--primary);border-color:var(--primary);font-weight:600;}
  main{padding:24px;max-width:1100px;margin:0 auto;}
  .card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:#444;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
  .req::after{content:" *";color:var(--primary);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row>div{flex:1;min-width:160px;}
  button.primary{background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-size:14px;margin-top:14px;}
  button.secondary{background:#eee;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;margin-top:8px;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  th,td{border:1px solid #e0e0e0;padding:8px;text-align:left;}
  th{background:#fafafa;}
  .badge{padding:3px 10px;border-radius:20px;font-size:12px;color:#fff;}
  .badge.wait{background:var(--warn);}
  .badge.ready{background:#2980b9;}
  .badge.sent{background:var(--ok);}
  .badge.followup{background:#8e44ad;}
  .badge.overdue{background:var(--primary);}
  .item-block{border:1px dashed #ccc;border-radius:8px;padding:12px;margin-top:10px;position:relative;}
  .items-table td,.items-table th{vertical-align:middle;}
  .items-table td input{margin:0;}
  .items-table td:nth-child(2) input{width:70px;}
  #ban-merk-extra input{width:100%;}
  .row-remove{background:none;border:none;color:var(--primary);font-size:18px;line-height:1;cursor:pointer;padding:4px 8px;margin:0;}
  .kpi{display:flex;gap:16px;flex-wrap:wrap;}
  .kpi .box{flex:1;min-width:150px;background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .kpi .box .num{font-size:26px;font-weight:700;color:var(--primary);}
  .kpi .box .lbl{font-size:12px;color:#777;}
  .note{font-size:12px;color:#888;margin-top:6px;}
</style>
</head>
<body>

<header>
  <h1>🔧 DA-SAR<span class="subtitle">Daya Saran Perbaikan</span></h1>
  <select id="roleSwitch">
    <option value="teknisi">Login sebagai: Teknisi</option>
    <option value="foreman">Login sebagai: Foreman</option>
    <option value="sa">Login sebagai: Service Advisor</option>
    <option value="kabengkel">Login sebagai: Kepala Bengkel</option>
  </select>
  <select id="saSwitch" style="display:none;width:auto;">
    <option value="">-- Pilih Nama SA --</option>
  </select>
</header>

<nav id="tabs"></nav>
<main id="app"></main>

<script>
/* ============================================================
   GANTI dengan URL Web App hasil deploy Google Apps Script:
   contoh: https://script.google.com/macros/s/XXXXXXX/exec
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbyWb1fyKjQqjigkPWeCqYWGUePO_1mobVKYK8mnNRAO5Er1zXTXk-3x3GXVuw1TB6nPvw/exec";

let currentRole = "teknisi";
let currentDetailId = null;
let currentSA = "";
let currentView = null;

const TABS = {
  teknisi:   [["input","Input Saran Baru"],["riwayat","Riwayat Saya"]],
  foreman:   [["antrian","Antrian Perlu Dilengkapi"]],
  sa:        [["konfirmasi","Perlu Dikonfirmasi"],["followup","Follow Up"],["laporan","Kirim Report Customer"]],
  kabengkel: [["dashboard","Dashboard"],["semua","Semua Kunjungan"]],
};

document.getElementById('roleSwitch').addEventListener('change', e=>{
  currentRole = e.target.value;
  currentSA = "";
  updateSaSwitch();
  renderTabs();
});
document.getElementById('saSwitch').addEventListener('change', e=>{
  currentSA = e.target.value;
  render(currentView || TABS[currentRole][0][0]);
});
async function updateSaSwitch(){
  const saSwitch = document.getElementById('saSwitch');
  if(currentRole !== 'sa'){ saSwitch.style.display = 'none'; return; }
  saSwitch.style.display = '';
  const md = await loadMasterData();
  saSwitch.innerHTML = optionList(md.Service_Advisor);
  saSwitch.value = currentSA;
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  TABS[currentRole].forEach(([key,label],i)=>{
    const b = document.createElement('button');
    b.textContent = label;
    if(i===0) b.classList.add('active');
    b.onclick = ()=>{ [...nav.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); render(key); };
    nav.appendChild(b);
  });
  render(TABS[currentRole][0][0]);
}

async function api(action, method='GET', body=null){
  if(API_URL.includes('PASTE_URL')){
    alert('Prototype mode: API_URL belum di-set. Ini hanya tampilan UI. Set API_URL ke Web App Apps Script untuk fungsi penuh.');
    return { demo:true };
  }
  if(method==='GET'){
    const url = API_URL + '?action=' + action + (body? '&'+new URLSearchParams(body).toString():'');
    return fetch(url).then(r=>r.json());
  }
  return fetch(API_URL, { method:'POST', body: JSON.stringify({action, ...body}) }).then(r=>r.json());
}

function render(view){
  currentView = view;
  const app = document.getElementById('app');
  if(view==='input') return renderInputTeknisi(app);
  if(view==='riwayat') return renderRiwayatTeknisi(app);
  if(view==='antrian') return renderAntrianForeman(app);
  if(view==='konfirmasi') return renderKonfirmasiSA(app);
  if(view==='followup') return renderFollowUp(app);
  if(view==='laporan') return renderLaporan(app);
  if(view==='dashboard') return renderDashboard(app);
  if(view==='semua') return renderSemua(app);
}
function requireSA(app){
  if(currentSA) return true;
  app.innerHTML = '<div class="card"><p class="note">Pilih nama SA Anda dulu di pojok kanan atas.</p></div>';
  return false;
}

/* ---------- TEKNISI: input saran ---------- */
let itemCount = 0;
let masterData = null;
async function loadMasterData(){
  if(masterData) return masterData;
  const md = await api('masterData');
  masterData = (md && !md.error) ? md : { Tipe_Mobil:[], Tipe_Service:[], Service_Advisor:[], Teknisi:[], SSC:[], Alasan_SSC:[] };
  return masterData;
}
function normalizeNoPolisi(el){
  el.value = el.value.toUpperCase().split(' ').join('');
}
function formatRibuan(el){
  const digits = el.value.replace(/\D/g,'');
  el.value = digits ? Number(digits).toLocaleString('id-ID') : '';
}
function toRibuan(n){
  n = Number(n) || 0;
  return n ? n.toLocaleString('id-ID') : '';
}
function parseRibuan(str){
  const digits = (str||'').toString().replace(/\D/g,'');
  return digits ? Number(digits) : 0;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function optionList(values){
  return '<option value="">-- Pilih --</option>' + (values||[]).map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
}
// Sisipkan `value` ke daftar kalau belum ada - supaya data lama yang nilainya sudah
// tidak ada lagi di MasterData tetap terlihat & tidak diam-diam jadi kosong saat diedit.
function ensureOptionPresent(values, value){
  values = values || [];
  return (value && !values.includes(value)) ? values.concat([value]) : values;
}
// Set value sebuah <select>, dan kalau value itu bukan salah satu <option> yang ada
// (mis. MasterData sudah diubah sejak baris ini dibuat), sisipkan dulu sebagai
// option baru supaya nilai lama tetap terlihat & tidak diam-diam jadi kosong.
function setSelectValuePreserving(selectEl, value){
  if(!value){ selectEl.value = ''; return; }
  if(![...selectEl.options].some(o=>o.value===value)){
    const opt = document.createElement('option');
    opt.value = value; opt.textContent = value;
    selectEl.appendChild(opt);
  }
  selectEl.value = value;
}
function optionListWithOther(values){
  return optionList(values) + '<option value="Others">Others</option>';
}
function toggleOther(selectEl){
  const otherInput = selectEl.nextElementSibling;
  otherInput.style.display = selectEl.value === 'Others' ? '' : 'none';
  if(selectEl.value !== 'Others') otherInput.value = '';
}
function readDropdownWithOther(selectEl){
  return selectEl.value === 'Others' ? selectEl.nextElementSibling.value : selectEl.value;
}
function checklistRow(key, label){
  const hargaCell = key === 'ban' ? '<td></td>' : `<td><input id="chk-harga-${key}" type="text" inputmode="numeric" oninput="formatRibuan(this)" style="display:none"></td>`;
  return `
  <tr>
    <td>${label}</td>
    <td><select id="chk-status-${key}" onchange="toggleHarga('${key}')"><option value="OK">OK</option><option value="NOK">NOK</option></select></td>
    <td><input id="chk-ket-${key}"></td>
    ${hargaCell}
  </tr>`;
}
function toggleHarga(key){
  const status = document.getElementById('chk-status-'+key).value;
  const hargaEl = document.getElementById('chk-harga-'+key);
  if(hargaEl){
    hargaEl.style.display = status === 'NOK' ? '' : 'none';
    if(status !== 'NOK') hargaEl.value = '';
  }
  if(key === 'ban'){
    const extra = document.getElementById('ban-merk-extra');
    extra.style.display = status === 'NOK' ? '' : 'none';
    if(status !== 'NOK'){
      ['ban-merk1','ban-harga1','ban-merk2','ban-harga2'].forEach(id => document.getElementById(id).value = '');
    }
  }
}
function readChecklist(key){
  const hargaEl = document.getElementById('chk-harga-'+key);
  return {
    status: document.getElementById('chk-status-'+key).value,
    keterangan: document.getElementById('chk-ket-'+key).value,
    harga: hargaEl ? parseRibuan(hargaEl.value) : 0
  };
}
function toggleHybrid(){
  const isYes = document.getElementById('mobilHybrid').value === 'Yes';
  document.getElementById('hybrid-sub').style.display = isYes ? '' : 'none';
  if(!isYes){
    document.getElementById('sbe50k100k').value = 'No';
    document.getElementById('mobil2to5Tahun').value = 'No';
  }
  toggleHHC();
}
function toggleHHC(){
  const hybridYes = document.getElementById('mobilHybrid').value === 'Yes';
  const sbeYes = document.getElementById('sbe50k100k').value === 'Yes';
  const mobil2to5Yes = document.getElementById('mobil2to5Tahun').value === 'Yes';
  const show = hybridYes && (sbeYes || mobil2to5Yes);
  document.getElementById('hhc-block').style.display = show ? '' : 'none';
  if(!show){
    document.getElementById('hhcStatus').value = 'No';
    document.getElementById('hhcHasil').value = '';
  }
}
function dataUnitCardHtml(md, today){
  return `
  <div class="card">
    <h3>Data Unit / Customer</h3>
    <div class="row">
      <div><label class="req">No. Polisi</label><input id="noPolisi" placeholder="B1234ABC" oninput="normalizeNoPolisi(this)"></div>
      <div><label class="req">Nama Customer</label><input id="namaCustomer"></div>
      <div><label>No. HP Customer</label><input id="noHp"></div>
    </div>
    <div class="row">
      <div><label class="req">Tipe Mobil</label><select id="tipeMobil">${optionList(md.Tipe_Mobil)}</select></div>
      <div><label class="req">Tipe Service</label><select id="tipeService">${optionList(md.Tipe_Service)}</select></div>
      <div><label class="req">Tanggal Service</label><input id="tanggalService" type="date" value="${today}"></div>
    </div>
    <div class="row">
      <div><label class="req">Service Advisor</label><select id="sa">${optionList(md.Service_Advisor)}</select></div>
      <div><label class="req">Teknisi</label><select id="teknisi">${optionList(md.Teknisi)}</select></div>
    </div>
  </div>`;
}
function prosesServiceCardHtml(){
  return `
  <div class="card">
    <h3>Proses Service</h3>
    <label>Pekerjaan</label>
    <textarea id="pekerjaan" rows="3"></textarea>
    <label>Request Customer</label>
    <textarea id="requestCustomer" rows="3"></textarea>
    <div style="overflow-x:auto;">
      <table class="items-table checklist-table">
        <thead>
          <tr><th>Komponen</th><th>Status</th><th>Keterangan</th><th>Harga</th></tr>
        </thead>
        <tbody>
          ${checklistRow('aki','Aki')}
          ${checklistRow('ban','Ban')}
        </tbody>
        <tbody id="ban-merk-extra" style="display:none">
          <tr>
            <td></td>
            <td colspan="3">
              <div class="row">
                <div><label>Merk 1</label><input id="ban-merk1"></div>
                <div><label>Harga 1</label><input id="ban-harga1" type="text" inputmode="numeric" oninput="formatRibuan(this)"></div>
              </div>
              <div class="row">
                <div><label>Merk 2</label><input id="ban-merk2"></div>
                <div><label>Harga 2</label><input id="ban-harga2" type="text" inputmode="numeric" oninput="formatRibuan(this)"></div>
              </div>
            </td>
          </tr>
        </tbody>
        <tbody>
          ${checklistRow('kampasRem','Kampas Rem')}
          ${checklistRow('wiper','Wiper')}
          ${checklistRow('lampu','Lampu')}
        </tbody>
      </table>
    </div>
  </div>`;
}
function hybridHealthCheckCardHtml(){
  return `
  <div class="card">
    <h3>Hybrid Health Check</h3>
    <div class="row">
      <div><label>Mobil Hybrid</label>
        <select id="mobilHybrid" onchange="toggleHybrid()"><option value="No">No</option><option value="Yes">Yes</option></select>
      </div>
    </div>
    <div id="hybrid-sub" style="display:none">
      <p class="note">*muncul jika memilih Yes</p>
      <div class="row">
        <div><label>SBE 50K - 100K</label>
          <select id="sbe50k100k" onchange="toggleHHC()"><option value="No">No</option><option value="Yes">Yes</option></select>
        </div>
        <div><label>Mobil diatas &gt;2 Tahun dan &lt;5 Tahun</label>
          <select id="mobil2to5Tahun" onchange="toggleHHC()"><option value="No">No</option><option value="Yes">Yes</option></select>
        </div>
      </div>
      <div id="hhc-block" style="display:none">
        <p class="note">*muncul jika salah satu dari kriteria setelah memilih Mobil Hybrid memilih Yes</p>
        <div class="row">
          <div><label>HHC</label>
            <select id="hhcStatus"><option value="No">No</option><option value="Yes">Yes</option></select>
          </div>
          <div><label>Hasil</label>
            <select id="hhcHasil"><option value="">-- Pilih --</option><option value="Good">Good</option><option value="Not Good">Not Good</option></select>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
function fillHybridHealthCheckFromKunjungan(kj){
  document.getElementById('mobilHybrid').value = kj.Mobil_Hybrid || 'No';
  document.getElementById('sbe50k100k').value = kj.SBE_50K_100K || 'No';
  document.getElementById('mobil2to5Tahun').value = kj.Mobil_2_5_Tahun || 'No';
  document.getElementById('hhcStatus').value = kj.HHC || 'No';
  document.getElementById('hhcHasil').value = kj.HHC_Hasil || '';
  toggleHybrid();
}
function ujiEmisiCardHtml(){
  return `
  <div class="card">
    <h3>Uji Emisi</h3>
    <div class="row">
      <div><label>Status</label>
        <select id="ujiEmisiStatus"><option value="Tidak Aktif">Tidak Aktif</option><option value="Aktif">Aktif</option></select>
      </div>
      <div><label>Foto</label>
        <input id="ujiEmisiFoto" type="file" accept="image/*">
        <div id="ujiEmisiFotoExisting" class="note"></div>
      </div>
    </div>
  </div>`;
}
function fillUjiEmisiFromKunjungan(kj){
  document.getElementById('ujiEmisiStatus').value = kj.UjiEmisi_Status || 'Tidak Aktif';
  const existing = document.getElementById('ujiEmisiFotoExisting');
  existing.innerHTML = kj.UjiEmisi_Foto_URL ? `Foto saat ini: <a href="${kj.UjiEmisi_Foto_URL}" target="_blank">lihat</a> (upload baru untuk mengganti)` : '';
}
function toDateInputValue(isoString){
  if(!isoString) return '';
  const d = new Date(isoString);
  if(isNaN(d)) return '';
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}
function fillProsesServiceFromKunjungan(kj){
  document.getElementById('pekerjaan').value = kj.Pekerjaan || '';
  document.getElementById('requestCustomer').value = kj.Request_Customer || '';
  ['aki','ban','kampasRem','wiper','lampu'].forEach(key=>{
    const prefix = key === 'kampasRem' ? 'KampasRem' : key.charAt(0).toUpperCase()+key.slice(1);
    document.getElementById('chk-status-'+key).value = kj[prefix+'_Status'] || 'OK';
    document.getElementById('chk-ket-'+key).value = kj[prefix+'_Keterangan'] || '';
    const hargaEl = document.getElementById('chk-harga-'+key);
    if(hargaEl) hargaEl.value = toRibuan(kj[prefix+'_Harga']);
  });
  document.getElementById('ban-merk1').value = kj.Ban_Merk1 || '';
  document.getElementById('ban-harga1').value = toRibuan(kj.Ban_Harga1);
  document.getElementById('ban-merk2').value = kj.Ban_Merk2 || '';
  document.getElementById('ban-harga2').value = toRibuan(kj.Ban_Harga2);
  ['aki','ban','kampasRem','wiper','lampu'].forEach(key=>toggleHarga(key));
}
async function renderInputTeknisi(app){
  itemCount = 0;
  jasaCount = 0;
  app.innerHTML = `<div class="card"><p class="note">Memuat data...</p></div>`;
  const md = await loadMasterData();
  const today = new Date().toISOString().slice(0,10);
  app.innerHTML = `
  ${dataUnitCardHtml(md, today)}
  ${prosesServiceCardHtml()}

  <div class="card">
    <h3>Saran Perbaikan</h3>

    <h4>Nama Jasa</h4>
    <div style="overflow-x:auto;">
      <table class="items-table">
        <thead>
          <tr><th>Nama Jasa</th><th>Waktu</th><th>Harga Satuan</th><th>Keterangan</th><th></th></tr>
        </thead>
        <tbody id="jasaWrap"></tbody>
      </table>
    </div>
    <p class="note">Total Estimasi Biaya Jasa: <b id="totalJasa">Rp 0</b></p>
    <button class="secondary" onclick="addJasaRow()">+ Tambah Jasa</button>

    <h4 style="margin-top:22px;">Nama Parts <span class="note">(hanya isi jika part TIDAK tersedia di gudang)</span></h4>
    <div style="overflow-x:auto;">
      <table class="items-table">
        <thead>
          <tr>
            <th>Nama Parts</th>
            <th>Qty</th>
            <th>Harga Satuan</th>
            <th>Keterangan</th>
            <th>Ketersediaan</th>
            <th>Foto</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="itemsWrap"></tbody>
      </table>
    </div>
    <p class="note">Total Estimasi Biaya Parts: <b id="totalParts">Rp 0</b></p>
    <button class="secondary" onclick="addItemBlock()">+ Tambah Komponen</button>
  </div>

  ${hybridHealthCheckCardHtml()}

  <div class="card">
    <h3>Special Service Campaign</h3>
    <div class="row">
      <div><label>Terlibat</label>
        <select id="sscTerlibat" onchange="toggleSSC()"><option value="No">No</option><option value="Yes">Yes</option></select>
      </div>
    </div>
    <div id="ssc-block" style="display:none">
      <p class="note">*muncul jika memilih Yes</p>
      <div style="overflow-x:auto;">
        <table class="items-table">
          <thead><tr><th>SSC</th><th>Status</th><th>Alasan</th><th></th></tr></thead>
          <tbody id="sscWrap"></tbody>
        </table>
      </div>
      <button class="secondary" onclick="addSSCRow()">+ Tambah SSC</button>
    </div>
  </div>

  ${ujiEmisiCardHtml()}

  <button class="primary" onclick="submitKunjungan()">Simpan &amp; Kirim ke Foreman</button>
  `;
  addJasaRow();
  addItemBlock();
}
function toggleSSC(){
  const isYes = document.getElementById('sscTerlibat').value === 'Yes';
  document.getElementById('ssc-block').style.display = isYes ? '' : 'none';
  // #sscWrap cuma ada di form create Teknisi - di form edit Foreman (#foremanSSCWrap)
  // baris sudah diisi eksplisit dari data yang ada, jadi tidak perlu auto-tambah baris.
  const wrap = document.getElementById('sscWrap');
  if(isYes && wrap && !wrap.querySelector('tr')) addSSCRow();
}
function addSSCRow(){
  const md = masterData || {};
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><select class="ssc-name">${optionList(md.SSC)}</select></td>
    <td><select class="ssc-status"><option value="Sudah Dikerjakan">Sudah Dikerjakan</option><option value="Belum Dikerjakan">Belum Dikerjakan</option></select></td>
    <td>
      <select class="ssc-alasan" onchange="toggleOther(this)">${optionListWithOther(md.Alasan_SSC)}</select>
      <input class="ssc-alasan-other" style="display:none" placeholder="Sebutkan alasan lain">
    </td>
    <td><button type="button" class="row-remove" onclick="this.closest('tr').remove()" title="Hapus baris">&times;</button></td>
  `;
  document.getElementById('sscWrap').appendChild(tr);
}
let jasaCount = 0;
function addJasaRow(){
  jasaCount++;
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input class="j-nama"></td>
    <td><input class="j-waktu" placeholder="cth: 30 menit"></td>

function updateTotalParts(){
  const rows = [...document.querySelectorAll('#itemsWrap tr')];
  let total = 0;
  rows.forEach(r => {
    const qty = Number(r.querySelector('.f-qty').value) || 0;
    const harga = parseRibuan(r.querySelector('.f-harga').value);
    total += qty * harga;
  });
  document.getElementById('totalParts').textContent = 'Rp ' + total.toLocaleString('id-ID');
}
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function submitKunjungan(){
  const blocks = [...document.querySelectorAll('#itemsWrap tr')];
  const btn = document.querySelector('main button.primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  try{
    const items = [];
    for(const b of blocks){
      const namaKomponen = b.querySelector('.f-nama').value;
      const qty = b.querySelector('.f-qty').value;
      if(!namaKomponen || !qty) continue;
      const item = { namaKomponen, qty, hargaSatuan: parseRibuan(b.querySelector('.f-harga').value), keterangan: b.querySelector('.f-ket').value, ketersediaanPart: b.querySelector('.f-ketersediaan').value };
      const file = b.querySelector('.f-foto').files[0];
      if(file){
        if(btn) btn.textContent = 'Mengupload foto...';
        const base64Data = await fileToBase64(file);
        const uploadRes = await api('uploadFoto','POST',{ base64Data, mimeType: file.type, fileName: file.name });
        if(uploadRes && uploadRes.url) item.fotoUrl = uploadRes.url;
        else if(uploadRes && uploadRes.error) alert('Gagal upload foto "'+file.name+'": '+uploadRes.error);
        if(btn) btn.textContent = 'Menyimpan...';
      }
      items.push(item);
    }

    const itemsJasa = [];
    for(const b of document.querySelectorAll('#jasaWrap tr')){
      const namaJasa = b.querySelector('.j-nama').value;
      if(!namaJasa) continue;
      itemsJasa.push({
        namaJasa,
        waktu: b.querySelector('.j-waktu').value,
        hargaSatuan: parseRibuan(b.querySelector('.j-harga').value),
        keterangan: b.querySelector('.j-ket').value
      });
    }

    const itemsSSC = [];
    for(const b of document.querySelectorAll('#sscWrap tr')){
      const ssc = b.querySelector('.ssc-name').value;
      if(!ssc) continue;
      itemsSSC.push({
        ssc,
        status: b.querySelector('.ssc-status').value,
        alasan: readDropdownWithOther(b.querySelector('.ssc-alasan'))
      });
    }

    const ujiEmisi = { status: document.getElementById('ujiEmisiStatus').value };
    const ujiEmisiFile = document.getElementById('ujiEmisiFoto').files[0];
    if(ujiEmisiFile){
      if(btn) btn.textContent = 'Mengupload foto uji emisi...';
      const base64Data = await fileToBase64(ujiEmisiFile);
      const uploadRes = await api('uploadFoto','POST',{ base64Data, mimeType: ujiEmisiFile.type, fileName: ujiEmisiFile.name });
      if(uploadRes && uploadRes.url) ujiEmisi.fotoUrl = uploadRes.url;
      else if(uploadRes && uploadRes.error) alert('Gagal upload foto uji emisi: '+uploadRes.error);
      if(btn) btn.textContent = 'Menyimpan...';
    }

    const tipeMobil = document.getElementById('tipeMobil').value;
    const tipeService = document.getElementById('tipeService').value;
    const tanggalService = document.getElementById('tanggalService').value;
    const sa = document.getElementById('sa').value;
    const teknisi = document.getElementById('teknisi').value;
    if(!document.getElementById('noPolisi').value || !tipeMobil || !tipeService || !tanggalService || !sa || !teknisi){
      alert('No. Polisi, Tipe Mobil, Tipe Service, Tanggal Service, Service Advisor, dan Teknisi wajib diisi'); return;
    }
    const proses = {
      pekerjaan: document.getElementById('pekerjaan').value,
      requestCustomer: document.getElementById('requestCustomer').value,
      aki: readChecklist('aki'),
      ban: { ...readChecklist('ban'),
        merk1: document.getElementById('ban-merk1').value, harga1: parseRibuan(document.getElementById('ban-harga1').value),
        merk2: document.getElementById('ban-merk2').value, harga2: parseRibuan(document.getElementById('ban-harga2').value) },
      kampasRem: readChecklist('kampasRem'),
      wiper: readChecklist('wiper'),
      lampu: readChecklist('lampu')
    };
    const hybridHealthCheck = {
      mobilHybrid: document.getElementById('mobilHybrid').value,
      sbe50k100k: document.getElementById('sbe50k100k').value,
      mobil2to5Tahun: document.getElementById('mobil2to5Tahun').value,
      hhc: document.getElementById('hhcStatus').value,
      hasil: document.getElementById('hhcHasil').value
    };
    const body = {
      noPolisi: document.getElementById('noPolisi').value.toUpperCase().split(' ').join(''),
      namaCustomer: document.getElementById('namaCustomer').value,
      noHp: document.getElementById('noHp').value,
      tipeMobil, tipeService,
      tanggalMasuk: tanggalService,
      sa, teknisi,
      proses,
      items,
      itemsJasa,
      hybridHealthCheck,
      sscTerlibat: document.getElementById('sscTerlibat').value,
      itemsSSC,
      ujiEmisi
    };
    const res = await api('createKunjungan','POST',body);
    if(res.demo){
      alert('Demo: data akan tersimpan setelah API terhubung.');
    } else if(res.success){
      document.getElementById('app').innerHTML = teknisiSuccessHtml(res.idKunjungan, body.noPolisi);
      return;
    } else {
      alert('Gagal menyimpan: ' + (res.error || 'unknown error'));
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Simpan & Kirim ke Foreman'; }
  }
}
function teknisiSuccessHtml(idKunjungan, noPolisi){
  return `
  <div class="card">
    <h3>Tersimpan ✓</h3>
    <p>Data untuk <b>${escapeHtml(noPolisi)}</b> (ID: ${idKunjungan}) berhasil disimpan dan masuk antrian Foreman.</p>
    <button class="primary" onclick="printTeknisiReport('${idKunjungan}', this)">Cetak Laporan (Draft)</button>
    <button class="secondary" onclick="render('input')">+ Input Saran Baru Lain</button>
  </div>`;
}
async function printTeknisiReport(idKunjungan, btn){
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan PDF...'; }
  try{
    const res = await api('generateReport','POST',{ idKunjungan, printedBy: 'teknisi' });
    if(res && res.pdfUrl) window.open(res.pdfUrl, '_blank');
    else alert('Gagal membuat PDF: ' + (res && res.error ? res.error : 'unknown error'));
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Cetak Laporan (Draft)'; }
  }
}

    Lampu_Keterangan: document.getElementById('chk-ket-lampu').value,
    Lampu_Harga: parseRibuan(document.getElementById('chk-harga-lampu').value),
    Mobil_Hybrid: document.getElementById('mobilHybrid').value,
    SBE_50K_100K: document.getElementById('sbe50k100k').value,
    Mobil_2_5_Tahun: document.getElementById('mobil2to5Tahun').value,
    HHC: document.getElementById('hhcStatus').value,
    HHC_Hasil: document.getElementById('hhcHasil').value,
    SSC_Terlibat: document.getElementById('sscTerlibat').value,
    UjiEmisi_Status: document.getElementById('ujiEmisiStatus').value
  };
  const ujiEmisiFile = document.getElementById('ujiEmisiFoto').files[0];
  if(ujiEmisiFile){
    const base64Data = await fileToBase64(ujiEmisiFile);
    const uploadRes = await api('uploadFoto','POST',{ base64Data, mimeType: ujiEmisiFile.type, fileName: ujiEmisiFile.name });
    if(uploadRes && uploadRes.url) fields.UjiEmisi_Foto_URL = uploadRes.url;
    else if(uploadRes && uploadRes.error) alert('Gagal upload foto uji emisi: '+uploadRes.error);
  }
  return await api('updateKunjungan','POST',{ idKunjungan: currentDetailId, fields });
}
async function saveForemanChanges(){
  const res = await collectAndSaveForemanChanges();
  alert(res.success ? 'Perubahan tersimpan' : 'Gagal menyimpan: '+(res.error||'unknown error'));
}
async function finishAndGenerate(btn){
  const namaForeman = document.getElementById('namaForeman').value;
  if(!namaForeman){ alert('Nama Foreman wajib diisi'); return; }
  if(btn){ btn.disabled = true; btn.textContent = 'Mengirim...'; }
  try{
    const saveRes = await collectAndSaveForemanChanges();
    if(!saveRes.success && !saveRes.demo){ alert('Gagal menyimpan perubahan: '+(saveRes.error||'unknown error')); return; }
    const res = await api('generateReport','POST',{idKunjungan: currentDetailId, namaForeman, printedBy: 'foreman'});
    if(res.demo){
      alert('Demo: PDF akan dibuat setelah API terhubung.');
    } else if(res.pdfUrl){
      window.open(res.pdfUrl, '_blank');
      alert('Report terkirim ke SA.');
    } else {
      alert('Gagal membuat report: ' + (res.error || 'unknown error'));
    }
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Kirim ke SA'; }
  }
}

/* ---------- SA: konfirmasi jadwal, follow up & laporan ---------- */
async function renderKonfirmasiSA(app){
  if(!requireSA(app)) return;
  app.innerHTML = `<div class="card"><h3>Perlu Dikonfirmasi</h3><p class="note">Report yang baru sampai - cek/sesuaikan tanggal rencana follow up (default H+3), lalu konfirmasi supaya masuk ke kantong Follow Up.</p><div id="list">Memuat...</div></div>`;
  const rows = await api('listKunjungan');
  const list = document.getElementById('list');
  if(rows.demo){ list.innerHTML='<p class="note">Demo mode.</p>'; return; }
  const pending = rows.filter(r=>r.Status==='Report Terkirim' && r.SA===currentSA && r.FollowUp_Dikonfirmasi!=='Ya');
  list.innerHTML = pending.length ? pending.map(r=>`
    <div class="item-block">
      <b>${escapeHtml(r.No_Polisi)}</b> - ${escapeHtml(r.Nama_Customer)}
      <div class="row">
        <div><label>Tanggal Rencana Follow Up</label>
          <input type="date" id="tgl-${r.ID_Kunjungan}" value="${toDateInputValue(r.Tanggal_FollowUp_Rencana)}">
        </div>
      </div>
      <button type="button" class="primary" onclick="confirmFollowUpDate('${r.ID_Kunjungan}')">Konfirmasi</button>
    </div>`).join('') : '<p class="note">Tidak ada report baru yang perlu dikonfirmasi.</p>';
}
async function confirmFollowUpDate(id){
  const val = document.getElementById('tgl-'+id).value;
  if(!val){ alert('Tanggal wajib diisi'); return; }
  const res = await api('updateRow','POST',{ sheet:'Kunjungan', id, fields:{ Tanggal_FollowUp_Rencana: val, FollowUp_Dikonfirmasi: 'Ya' } });
  if(res.success){ renderKonfirmasiSA(document.getElementById('app')); }
  else alert('Gagal menyimpan: '+(res.error||'unknown error'));
}
async function renderFollowUp(app){
  if(!requireSA(app)) return;
  app.innerHTML = `<div class="card"><h3>Follow Up Customer</h3><div id="list">Memuat...</div></div>`;
  const rows = await api('listKunjungan');
  const list = document.getElementById('list');
  if(rows.demo){ list.innerHTML='<p class="note">Demo mode.</p>'; return; }
  const today = new Date(); today.setHours(0,0,0,0);
  const pending = rows.filter(r=>r.Status==='Report Terkirim' && r.SA===currentSA && r.FollowUp_Dikonfirmasi==='Ya' && (r.Status_FollowUp||'Belum')==='Belum');
  const overdue = pending.filter(r=>new Date(r.Tanggal_FollowUp_Rencana) <= today);
  const upcoming = pending.filter(r=>new Date(r.Tanggal_FollowUp_Rencana) > today);

  const cardHtml = (r, isOverdue) => `
    <div class="item-block">
      <b>${escapeHtml(r.No_Polisi)}</b> - ${escapeHtml(r.Nama_Customer)}
      <span class="badge ${isOverdue?'overdue':'wait'}">${isOverdue?'Lewat Jatuh Tempo':'Belum Jatuh Tempo'}</span>
      <div class="row">
        <div><label>Tanggal Rencana Follow Up</label>
          <input type="date" id="tgl-${r.ID_Kunjungan}" value="${toDateInputValue(r.Tanggal_FollowUp_Rencana)}">
        </div>
        <div style="align-self:flex-end;">
          <button type="button" class="secondary" onclick="saveFollowUpDate('${r.ID_Kunjungan}')">Simpan Tanggal</button>
        </div>
      </div>
      ${isOverdue ? `
      <div class="row">
        <div><label>Status Follow Up</label>
          <select id="fu-${r.ID_Kunjungan}">
            <option>Deal</option><option>Tidak Deal</option><option>Reschedule</option>
          </select>
        </div>
        <div><label>Catatan</label><input id="note-${r.ID_Kunjungan}"></div>
      </div>
      <button type="button" class="primary" onclick="saveFollowUp('${r.ID_Kunjungan}')">Simpan Hasil Follow Up</button>
      ` : ''}
    </div>`;

  list.innerHTML = `
    <h4>Sudah Lewat Jatuh Tempo (${overdue.length})</h4>
    ${overdue.length ? overdue.map(r=>cardHtml(r,true)).join('') : '<p class="note">Tidak ada.</p>'}
    <h4 style="margin-top:22px;">Belum Jatuh Tempo (${upcoming.length})</h4>
    ${upcoming.length ? upcoming.map(r=>cardHtml(r,false)).join('') : '<p class="note">Tidak ada.</p>'}
  `;
}
async function saveFollowUpDate(id){
  const val = document.getElementById('tgl-'+id).value;
  if(!val){ alert('Tanggal wajib diisi'); return; }
  const res = await api('updateRow','POST',{ sheet:'Kunjungan', id, fields:{ Tanggal_FollowUp_Rencana: val } });
  if(res.success){ renderFollowUp(document.getElementById('app')); }
  else alert('Gagal menyimpan: '+(res.error||'unknown error'));
}
async function saveFollowUp(id){
  const res = await api('updateFollowUp','POST',{
    idKunjungan:id,
    statusFollowUp: document.getElementById('fu-'+id).value,
    catatan: document.getElementById('note-'+id).value
  });
  if(res.success){ renderFollowUp(document.getElementById('app')); }
  else alert('Gagal menyimpan: '+(res.error||'unknown error'));
}
async function renderLaporan(app){
  if(!requireSA(app)) return;
  app.innerHTML = `<div class="card"><h3>Kunjungan Siap Dikirim ke Customer</h3><div id="list">Memuat...</div></div>`;
  const rows = await api('listKunjungan');
  const list = document.getElementById('list');
  if(rows.demo){ list.innerHTML='<p class="note">Demo mode.</p>'; return; }
  const mine = rows.filter(r=>r.SA===currentSA);
  list.innerHTML = mine.map(r=>`
    <div class="item-block">${escapeHtml(r.No_Polisi)} - ${escapeHtml(r.Nama_Customer)}
    <span class="badge sent">${r.Status}</span>
    ${r.PDF_URL ? `<br><a href="${r.PDF_URL}" target="_blank">Buka PDF Report</a>` : ''}</div>`).join('');
}

/* ---------- KEPALA BENGKEL: dashboard ---------- */
async function renderDashboard(app){
  app.innerHTML = `<div id="dash">Memuat...</div>`;
  const d = await api('dashboard');
  const dash = document.getElementById('dash');
  if(d.demo){ dash.innerHTML='<p class="note">Demo mode - hubungkan API untuk data real.</p>'; return; }
  let html = `<div class="kpi">
    <div class="box"><div class="num">${d.totalCustomer.hariIni}</div><div class="lbl">Customer Hari Ini</div></div>
    <div class="box"><div class="num">${d.totalCustomer.mingguIni}</div><div class="lbl">Customer Minggu Ini</div></div>
    <div class="box"><div class="num">${d.totalCustomer.bulanIni}</div><div class="lbl">Customer Bulan Ini</div></div>
    <div class="box"><div class="num">${d.totalKunjungan}</div><div class="lbl">Total Kunjungan</div></div>
  </div>
  <div class="card"><h3>Rekap per Service Advisor</h3>
  <table><tr><th>SA</th><th>Saran Hari Ini</th><th>Saran Minggu Ini</th><th>Saran Bulan Ini</th><th>Deal</th><th>Tidak Deal</th></tr>`;
  Object.entries(d.perSA).forEach(([sa,v])=>{
    html += `<tr><td>${sa}</td><td>${v.hari}</td><td>${v.minggu}</td><td>${v.bulan}</td><td>${v.deal}</td><td>${v.tidakDeal}</td></tr>`;
  });
  html += `</table></div>`;
  dash.innerHTML = html;
}
async function renderSemua(app){
  app.innerHTML = `<div class="card"><h3>Semua Kunjungan</h3><div id="list">Memuat...</div></div>`;

  const list = document.getElementById('list');

    `</table>`;
}
